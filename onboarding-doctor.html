<main class="shell">
  <section class="hero"><div class="eyebrow-pill">Registro médico</div><h1 id="onboardingHeroTitle">Activa tu cuenta médica.</h1><p>Completa paso a paso la información necesaria para que Pulzzo pueda validar tu perfil.</p><div class="stepper" id="stepper"></div><div class="mobile-progress-summary" id="mobileProgressSummary"><div class="mobile-progress-label" id="mobileProgressLabel">Paso 1 de 4</div><div class="mobile-progress-title" id="mobileProgressTitle">Documentos</div><div class="mobile-progress-bar"><span id="mobileProgressFill" style="width:25%"></span></div><div class="mobile-progress-next" id="mobileProgressNext">Siguiente: Fiscal y banco</div></div></section>

<div class="toast" id="toast"></div>
<script>
const banks=['Banca Afirme','Banca Mifel','Banco Actinver','Banco Azteca','Banco Bancrea','Banco Base','Banco Bineo','Banco Citi México','Banco Compartamos','Banco Covalto','Banco Credit Suisse (México)','Banco de Inversión Afirme','Banco del Bajío','Banco BanFeliz','Banco Inbursa','Banco Inmobiliario Mexicano','Banco Invex','Banco JP Morgan','Banco KEB Hana México','Banco Monex','Banco Multiva','Banco Nacional de México','Banco PagaTodo','Banco Plata','Banco Regional de Monterrey','Banco S3 Caceis México','Banco Sabadell','Banco Santander','Banco Shinhan de México','Banco Ve por Más','BanCoppel','Bank of America Mexico','Bank of China Mexico','Bankaool','Banorte','Bansí','Barclays Bank México','BBVA México','BNP Paribas','Consubanco','Fundación Dondé Banco','Hey Banco','HSBC México','Industrial and Commercial Bank of China','Intercam Banco','Kapital Bank','Mizuho Bank','MUFG Bank Mexico','Nu México','Openbank','Revolut','Scotiabank','UALÁ','Volkswagen Bank'];

const bankAliases={
  'Banco Nacional de México':['Banamex','Citibanamex','Citi'],
  'Banco Citi México':['Citi','Citibank']
};
function normalizeText(value){
  return String(value||'').normalize('NFD').replace(/[\u0300-\u036f]/g,'').toLowerCase().trim();
}
function bankAliasLabel(bank){
  return bank==='Banco Nacional de México'?'Banamex / Citibanamex':'';
}
function bankSearchText(bank){
  return normalizeText([bank,...(bankAliases[bank]||[])].join(' '));
}
function renderBankPicker(){
  const selected=state.fiscal.banco||'';
  return `<div class="bank-picker" id="bankPicker">
    <button type="button" class="bank-picker-toggle" id="bankPickerToggle" aria-haspopup="listbox" aria-expanded="false">
      <span class="${selected?'':'bank-picker-placeholder'}">${htmlSafe(selected||'Selecciona banco')}</span><span>⌄</span>
    </button>
    <div class="bank-picker-menu" id="bankPickerMenu">
      <input class="bank-search" id="bankSearch" type="text" placeholder="Buscar banco" autocomplete="off">
      <div class="bank-options" id="bankOptions" role="listbox">
        ${banks.map(bank=>`<button type="button" class="bank-option ${selected===bank?'is-selected':''}" data-bank="${htmlSafe(bank)}" data-search="${htmlSafe(bankSearchText(bank))}"><span class="bank-option-main">${htmlSafe(bank)}</span>${bankAliasLabel(bank)?`<span class="bank-option-alias">${htmlSafe(bankAliasLabel(bank))}</span>`:''}</button>`).join('')}
      </div>
      <div class="bank-empty" id="bankEmpty">No encontramos bancos con ese nombre.</div>
    </div>
  </div>`;
}
function bindBankPicker(){
  const picker=document.getElementById('bankPicker');
  if(!picker)return;
  const toggle=document.getElementById('bankPickerToggle');
  const menu=document.getElementById('bankPickerMenu');
  const search=document.getElementById('bankSearch');
  const options=[...document.querySelectorAll('.bank-option')];
  const empty=document.getElementById('bankEmpty');
  const close=()=>{picker.classList.remove('open');toggle?.setAttribute('aria-expanded','false');};
  const open=()=>{picker.classList.add('open');toggle?.setAttribute('aria-expanded','true');setTimeout(()=>search?.focus(),0);};
  const filter=()=>{
    const q=normalizeText(search?.value||'');
    let shown=0;
    options.forEach(opt=>{
      const ok=!q || String(opt.dataset.search||'').includes(q);
      opt.style.display=ok?'block':'none';
      if(ok)shown++;
    });
    empty?.classList.toggle('show',shown===0);
  };
  toggle.onclick=(e)=>{e.stopPropagation();picker.classList.contains('open')?close():open();};
  menu.onclick=e=>e.stopPropagation();
  search?.addEventListener('input',filter);
  options.forEach(opt=>{opt.onclick=()=>{state.fiscal.banco=opt.dataset.bank||'';delete state.errors.banco;save();renderFiscal();};});
  document.addEventListener('click',close,{once:true});
}
const especialidadesLabels={
  plastica:'Cirugía plástica y reconstructiva',
  estetica:'Medicina estética',
  bariatria:'Bariatría',
  general:'Cirugía general',
  ortopedia:'Ortopedia y traumatología',
  oftalmologia:'Oftalmología',
  ginecologia:'Ginecología y obstetricia',
  orl:'Otorrinolaringología',
  dental:'Dental y maxilofacial',
  dermatologia:'Dermatología',
  urologia:'Urología',
  gastro:'Gastroenterología',
  cardiologia:'Cardiología',

function norm(s){return String(s||'').toLowerCase().normalize('NFD').replace(/[\u0300-\u036f]/g,'');}
function htmlSafe(s){return String(s||'').replace(/[&<>'"]/g,m=>({'&':'&amp;','<':'&lt;','>':'&gt;',"'":'&#39;','"':'&quot;'}[m]));}
function readJsonStorage(key,fallback){try{const raw=localStorage.getItem(key);return raw?JSON.parse(raw):fallback}catch(e){return fallback}}
function storedProcedureGroups(){
  const labels=readJsonStorage('pulzzoDoctorSpecialties',[]);
  const groups=[];
  (Array.isArray(labels)?labels:[]).forEach(label=>{
    const key=Object.keys(especialidadesLabels).find(k=>especialidadesLabels[k]===label || k===label);
    const group=key?espToProcGroup[key]:label;
    if(group&&!groups.includes(group))groups.push(group);
  });
  return groups;
}

}

function renderGroupedProcedureList(list){
  const items=Array.isArray(list)?list:[];
  if(!items.length) return `<div class="proc-empty">Aún no hay procedimientos agregados.</div>`;
  const groups=[];
  items.forEach((name,index)=>{
    const group=procedureGroupName(name);
    let bucket=groups.find(g=>g.group===group);
    if(!bucket){bucket={group,items:[]};groups.push(bucket);}
    bucket.items.push({name,index});
  });
  return `<div class="proc-accordion-list">${groups.map(g=>`<details class="proc-accordion"><summary><span class="proc-accordion-main"><span class="proc-accordion-title">${htmlSafe(g.group)}</span><span class="proc-accordion-count">Ver ${g.items.length} procedimiento${g.items.length===1?'':'s'} seleccionado${g.items.length===1?'':'s'}</span></span></summary><div class="proc-accordion-body">${g.items.map(item=>`<div class="proc-accordion-row"><span>${htmlSafe(item.name)}</span><button class="remove-btn" type="button" data-remove="${item.index}">Quitar</button></div>`).join('')}</div></details>`).join('')}</div>`;
}

  document.getElementById('clearProcDraft').onclick=()=>{state.newProc=[];if(searchEl)searchEl.value='';save();document.querySelectorAll('.proc-option,.proc-group').forEach(row=>row.classList.remove('proc-filter-hidden'));if(emptySearchEl)emptySearchEl.classList.remove('is-visible');updateDraftUI()};
  searchEl.oninput=()=>{const q=norm(searchEl.value);let any=false;document.querySelectorAll('.proc-option').forEach(row=>{const show=!q||norm(row.textContent).includes(q)||String(row.dataset.procLabel||'').includes(q);row.classList.toggle('proc-filter-hidden',!show);if(show)any=true;});document.querySelectorAll('.proc-group').forEach(group=>{const visible=[...group.querySelectorAll('.proc-option')].some(row=>!row.classList.contains('proc-filter-hidden'));group.classList.toggle('proc-filter-hidden',!visible);});if(emptySearchEl)emptySearchEl.classList.toggle('is-visible',!!q&&!any);updateGroupButtons();};
  document.getElementById('addProcBtn').onclick=()=>{let draft=procedureDraft().filter(p=>allowedItems.includes(p));const hasOther=draft.some(isOtherProcedureName);let custom=String(state.otherProc||'').trim();if(hasOther&&!custom){state.errors.procedures='Escribe el procedimiento en el campo Otro para agregarlo.';save();render();return}let toAdd=draft.filter(p=>!isOtherProcedureName(p));if(hasOther)toAdd.push(custom);toAdd=[...new Set(toAdd.map(p=>String(p).trim()).filter(Boolean))];if(!toAdd.length){state.errors.procedures='Selecciona al menos un procedimiento.';render();return}toAdd.forEach(p=>{if(!state.procedures.includes(p))state.procedures.push(p)});state.newProc=[];state.otherProc='';delete state.errors.procedures;save();render()};
  updateDraftUI();
}

function selectOptions(value, options, placeholder='Selecciona una opción'){
  return `<option value="">${placeholder}</option>` + options.map(opt=>`<option value="${htmlSafe(opt)}" ${value===opt?'selected':''}>${htmlSafe(opt)}</option>`).join('');
}
function daysSelect(model, value, label){

}

}

  setHeader('Datos del perfil','Pendiente');

 de tus enlaces profesionales.</p></button></div><div class="inline-error" style="display:${state.errors.photo?'block':'none'}">${state.errors.photo||''}</div>${(state.files.profile_photo||[]).length?`<div class="profile-photo-preview">${state.profilePhotoData?`<img class="profile-photo-thumb" src="${state.profilePhotoData}" alt="Foto de perfil">`:`<div class="file-icon">🖼️</div>`}<div style="flex:1"><div class="file-name">${state.files.profile_photo[0].name}</div><div class="file-meta">${state.files.profile_photo[0].type||'imagen'} · ${formatBytes(state.files.profile_photo[0].size)}</div></div><span class="pill pill-green">Listo</span><button class="file-view" type="button" data-doc="profile_photo" data-idx="0">Ver foto</button></div>`:''}</div>${isDoctor?doctorExtra:clinicExtra}`;
  bindModelInputs();bindUploads();bindViews();
  document.querySelectorAll('select[data-model^="profileData."]').forEach(sel=>sel.addEventListener('change',()=>setTimeout(renderData,0)));

function bindModelInputs(){document.querySelectorAll('[data-model]').forEach(el=>{const update=()=>{let val=el.value;if(el.dataset.model==='profileData.adminContactPhone')val=phoneFormatMX(val);else if(el.classList.contains('phone-input'))val=phoneFormat(val);if(el.dataset.model==='fiscal.rfc')val=cleanRfc(val);if(el.dataset.model==='fiscal.clabe')val=digits(val).slice(0,18);el.value=val;const [group,key]=el.dataset.model.split('.');state[group][key]=val;if(state.errors[key])delete state.errors[key];if(group==='links'&&Object.values(state.links).some(v=>String(v).trim()))delete state.errors.links;save()};el.addEventListener('input',update);el.addEventListener('change',update)})}
function maxFilesForDoc(id){
  const doc=docs.find(d=>d.id===id);
  if(doc)return doc.min;
  const clinicDocMax={clinic_rep_ine:2,csf:1,legal_power:1,cofepris_permit:1,clinic_address_proof:1,treatment_cert:1};
  if(Object.prototype.hasOwnProperty.call(clinicDocMax,id))return clinicDocMax[id];
  if(id==='bank_cover'||id==='profile_photo'||id==='med_license'||id==='gen_surgery_license'||id==='council_cert'||id==='additional_cert'||id==='pending_proof'||String(id).startsWith('specialty_license_'))return 1;
  return 1;
}
function bindUploads(){document.querySelectorAll('.upload-input[data-doc]').forEach(input=>input.addEventListener('change',e=>{
  const id=e.target.dataset.doc;
  const max=maxFilesForDoc(id);
  let current=state.files[id]||[];
  if(id==='profile_photo') current=[];
  const selected=Array.from(e.target.files||[]);
  const available=Math.max(0,max-current.length);
  if(available<=0){
    showToast(`Este campo solo permite ${max} archivo${max>1?'s':''}.`);
    e.target.value='';
    return;
  }
  const accepted=selected.slice(0, id==='profile_photo' ? 1 : available);
  if(id==='profile_photo'){
    state.files[id]=accepted.map(file=>({name:file.name,type:file.type,size:file.size,file}));
  }else{
    state.files[id]=current.concat(accepted.map(file=>({name:file.name,type:file.type,size:file})));
  }
  if(selected.length>available && id!=='profile_photo')showToast(`Solo se agregaron ${available} archivo${available!==1?'s':''}. Máximo permitido: ${max}.`);
  if(id==='profile_photo'&&e.target.accept.includes('image')){
    state.photoMode=e.target.capture?'camera':'upload';
    const photoFile=accepted[0];
    if(photoFile){
      const reader=new FileReader();
      reader.onload=()=>{state.profilePhotoData=reader.result;save();};
      reader.readAsDataURL(photoFile);
    }
  }
  delete state.errors[id];
  e.target.value='';
  save();
  render();
}))}

let cameraStream=null;
let cameraTarget={type:'profile',docId:null};
function stopProfileCamera(){
  if(cameraStream){cameraStream.getTracks().forEach(t=>t.stop());cameraStream=null;}
}
function bindDocCameraButtons(){
  document.querySelectorAll('[data-camera-doc]').forEach(btn=>{
    btn.onclick=()=>openDocCamera(btn.dataset.cameraDoc);
  });
}
async function openCamera(target,options,fallback,title){
  cameraTarget=target;
  const modalTitle=document.querySelector('#cameraModal .modal-title');
  if(modalTitle)modalTitle.textContent=title||'Tomar foto';
  if(!navigator.mediaDevices||!navigator.mediaDevices.getUserMedia){fallback();return;}
  try{
    cameraStream=await navigator.mediaDevices.getUserMedia({video:options,audio:false});
    const video=document.getElementById('cameraVideo');
    video.srcObject=cameraStream;
    document.getElementById('cameraModal').classList.add('open');
  }catch(err){
    fallback();
  }
}
function openDocCamera(docId){
  const fallback=()=>{
    const input=document.getElementById(`camera-input-${docId}`);
    if(input)input.click();
  };
  openCamera({type:'doc',docId},{facingMode:'environment'},fallback,'Tomar foto del documento');
}
async function openProfileCamera(){
  state.photoMode='camera';
  delete state.errors.photo;
  save();
  const fallback=()=>{
    const input=document.getElementById('profileCameraInput');
    if(input)input.click();
  };
  openCamera({type:'profile',docId:null},{facingMode:'user'},fallback,'Tomar foto de perfil');
}
function captureProfilePhoto(){
  const video=document.getElementById('cameraVideo');
  if(!video||!video.videoWidth){return;}
  const canvas=document.createElement('canvas');
  canvas.width=video.videoWidth;
  canvas.height=video.videoHeight;
  canvas.getContext('2d').drawImage(video,0,0,canvas.width,canvas.height);
  canvas.toBlob(blob=>{
    if(!blob)return;
    const dataUrl=canvas.toDataURL('image/png');
    if(cameraTarget.type==='doc'&&cameraTarget.docId){
      const docId=cameraTarget.docId;
      const max=maxFilesForDoc(docId);
      const current=state.files[docId]||[];
      if(current.length>=max){
        closeProfileCamera();
        showToast(`Este campo solo permite ${max} archivo${max>1?'s':''}.`);
        return;
      }
      const file=new File([blob],`${docId}-foto-${current.length+1}.png`,{type:'image/png'});
      state.files[docId]=current.concat([{name:file.name,size:file.size,type:file.type,file}]);
      delete state.errors[docId];
      save();
      closeProfileCamera();
      render();
      return;
    }
    const file=new File([blob],'foto-perfil.png',{type:'image/png'});
    state.photoMode='camera';
    state.files.profile_photo=[{name:file.name,size:file.size,type:file.type,file}];
    state.profilePhotoData=dataUrl;
    delete state.errors.photo;
    save();
    closeProfileCamera();
    renderData();
  },'image/png');
}
function closeProfileCamera(){
  stopProfileCamera();
  document.getElementById('cameraModal').classList.remove('open');
}

function bindViews(){document.querySelectorAll('.file-view').forEach(btn=>btn.onclick=()=>openFile(btn.dataset.doc,Number(btn.dataset.idx)))}
function openFile(docId,idx){const item=(state.files[docId]||[])[idx];const body=document.getElementById('modalBody'),title=document.getElementById('modalTitle');if(!item){body.innerHTML='<div class="preview-empty">No hay documento para mostrar.</div>';document.getElementById('docModal').classList.add('open');return}title.textContent=item.name;if(!item.file){body.innerHTML='<div class="preview-empty"><strong>'+item.name+'</strong><br>La vista previa no está disponible después de recargar la página. Vuelve a subir el archivo para verlo en demo.</div>';document.getElementById('docModal').classList.add('open');return}const url=URL.createObjectURL(item.file);if((item.type||'').startsWith('image/'))body.innerHTML=`<img class="preview-img" src="${url}" alt="${item.name}">`;else if((item.type||'').includes('pdf'))body.innerHTML=`<iframe class="preview-frame" src="${url}" title="${item.name}"></iframe>`;else body.innerHTML='<div class="preview-empty">Vista previa no disponible.</div>';document.getElementById('docModal').classList.add('open')}
function validateStep(){state.errors={};if(state.currentStep===1){if(accountType()!=='doctor'){const cd=state.clinicDocs||{};if(!cd.legalType)state.errors.legalType='Selecciona si opera como persona física o persona moral.';const ineTitle=cd.legalType==='physical'?'INE del titular o propietario':'INE del representante legal';const requiredClinicDocs=[{id:'csf',title:'Constancia de Situación Fiscal',min:1},{id:'clinic_rep_ine',title:ineTitle,min:2},...(cd.legalType==='moral'?[{id:'legal_power',title:'Poder del representante legal',min:1}]:[]),{id:'cofepris_permit',title:'Documento sanitario COFEPRIS',min:1},{id:'clinic_address_proof',title:'Comprobante de domicilio de la clínica u hospital',min:1}];if(cd.legalType){if(!cd.sanitaryDocType)state.errors.sanitaryDocType='Selecciona qué documento sanitario COFEPRIS estás subiendo.';requiredClinicDocs.forEach(d=>{if((state.files[d.id]||[]).length<d.min)state.errors[d.id]=d.min===2?`Sube frente y reverso de ${d.title.toLowerCase()} para continuar.`:`Completa ${d.title} para continuar.`});}if(cd.legalType){if(!cd.certRequired)state.errors.certRequired='Indica si algún tratamiento requiere certificación adicional.';if(cd.certRequired==='yes'){if(!String(cd.certProcedure||'').trim())state.errors.certProcedure='Indica el tratamiento o procedimiento relacionado.';if((state.files.treatment_cert||[]).length<1)state.errors.treatment_cert='Sube la certificación o permiso adicional del tratamiento.';}}if(Object.keys(state.errors).length){render();scrollErr();return false}}else{docs.forEach(d=>{if((state.files[d.id]||[]).length<d.min)state.errors[d.id]=d.min===2?`Sube frente y reverso de ${d.title.toLowerCase()} para continuar.`:`Completa ${d.title} para continuar.`});const mv=state.medval||{};if(!mv.procedureType)state.errors.procedureType='Selecciona el tipo de procedimientos que realizas.';if(!mv.method)state.errors.method='Selecciona cómo quieres validar tus documentos.';const isSurgical=mv.procedureType==='surgical'||mv.procedureType==='both';if(mv.method==='upload'){if((state.files.med_license||[]).length<1)state.errors.med_license='Sube tu cédula profesional médica para continuar.';selectedMedicalSpecialties().forEach(label=>{const id=docIdForSpecialty(label);if((state.files[id]||[]).length<1)state.errors[id]=`Sube la cédula de especialidad: ${label}.`;});if(isSurgical && !mv.generalSurgeryNotApplicable && (state.files.gen_surgery_license||[]).length<1)state.errors.gen_surgery_license='Sube la cédula de Cirugía General o marca No aplica.';}if(mv.method==='validate'){if(!String(mv.curp||'').trim())state.errors.curp='Ingresa tu CURP para continuar.';}if(mv.method==='upload'||mv.method==='validate'){if(!mv.pendingQuestion)state.errors.pendingQuestion='Indica si tienes algún documento en trámite o aún no visible.';if(mv.pendingQuestion==='yes'){if(!String(mv.curp||'').trim())state.errors.curp='Ingresa tu CURP para continuar.';if(!mv.pendingDocType)state.errors.pendingDocType='Selecciona el tipo de documento en trámite.';if(['Cédula de especialidad','Consejo / certificación profesional','Certificación adicional'].includes(mv.pendingDocType)&&!mv.pendingSpecialty)state.errors.pendingSpecialty='Selecciona la especialidad relacionada.';if((state.files.pending_proof||[]).length<1)state.errors.pending_proof='Sube la constancia o comprobante de trámite.';}}if(Object.keys(state.errors).length){render();scrollErr();return false}}}if(state.currentStep===2){const rfc=cleanRfc(state.fiscal.rfc);state.fiscal.rfc=rfc;if(rfc.length!==expectedRfcLength())state.errors.rfc=`El RFC debe tener ${expectedRfcLength()} caracteres.`;if(!state.fiscal.banco.trim())state.errors.banco='Selecciona un banco para continuar.';if(!/^\d{18}$/.test(digits(state.fiscal.clabe)))state.errors.clabe='La CLABE debe tener 18 dígitos.';if(!state.fiscal.titular.trim())state.errors.titular='Ingresa el titular de la cuenta.';if((state.files.bank_cover||[]).length<1)state.errors.bank_cover='Sube la carátula de estado de cuenta para continuar.';if(Object.keys(state.errors).length){render();scrollErr();return false}}if(state.currentStep===3){if(state.contact.visible==='office'&&digits(state.contact.officePhone).length!==10)state.errors.officePhone='Ingresa un teléfono válido de 10 dígitos.';if(state.contact.visible==='whatsapp'&&digits(state.contact.officeWhats).length!==10)state.errors.officeWhats='Ingresa un WhatsApp válido de 10 dígitos.';if(digits(state.contact.officePhone).length>0&&digits(state.contact.officePhone).length!==10)state.errors.officePhone='Ingresa un teléfono válido de 10 dígitos.';if(digits(state.contact.officeWhats).length>0&&digits(state.contact.officeWhats).length!==10)state.errors.officeWhats='Ingresa un WhatsApp válido de 10 dígitos.';if(Object.keys(state.errors).length){render();scrollErr();return false}}if(state.currentStep===4){if(!Object.values(state.links).some(v=>String(v).trim()))state.errors.links='Agrega al menos un enlace profesional para continuar.';if(!state.photoMode && !(state.files.profile_photo||[]).length)state.errors.photo='Elige una opción para la foto de perfil médico.';if(Object.keys(state.errors).length){render();scrollErr();return false}}return true}
function scrollErr(){setTimeout(()=>{const el=document.querySelector('.has-error,.inline-error[style*="block"]');if(el)el.scrollIntoView({behavior:'smooth',block:'center'})},80)}
function next(){if(!validateStep())return;if(state.currentStep<4){state.currentStep++;save();render();window.scrollTo({top:120,behavior:'smooth'})}else{state.submitted=true;state.submittedAt=new Date().toISOString();localStorage.setItem('pulzzoDoctorOnboardingCleanV3Status','perfil_en_revision');save();location.href='registro-doctor.html#perfil-medico'}}function back(){if(state.currentStep>1){state.currentStep--;save();render();window.scrollTo({top:120,behavior:'smooth'})}else location.href='registro-doctor.html'}
function render(){updateHeroTitle();renderStepper();updateMobileProgress();document.getElementById('nextBtn').textContent=state.currentStep===4?'Crear perfil médico':'Continuar';if(state.currentStep===1)renderDocs();if(state.currentStep===2)renderFiscal();if(state.currentStep===3)renderContact();if(state.currentStep===4)renderData()}
document.getElementById('nextBtn').onclick=next;document.getElementById('backBtn').onclick=back;document.getElementById('saveBtn').onclick=()=>{save();showToast('Avance guardado')};document.getElementById('modalClose').onclick=()=>document.getElementById('docModal').classList.remove('open');document.getElementById('docModal').onclick=e=>{if(e.target.id==='docModal')document.getElementById('docModal').classList.remove('open')};document.getElementById('cameraClose').onclick=closeProfileCamera;document.getElementById('cameraCancel').onclick=closeProfileCamera;document.getElementById('cameraCapture').onclick=captureProfilePhoto;document.getElementById('cameraModal').onclick=e=>{if(e.target.id==='cameraModal')closeProfileCamera()};if(location.hash==='#documentos'){state.currentStep=1;save()}if(location.hash==='#fiscal'){state.currentStep=2;save()}if(location.hash==='#contacto'){state.currentStep=3;save()}if(location.hash==='#datos'){state.currentStep=4;save()}render();
