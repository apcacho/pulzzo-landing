function dispersionPeriodDays(fromDate,toDate){
  const from=parseLocalDate(fromDate)||getTodayLocalMX();
  const to=parseLocalDate(toDate)||getTodayLocalMX();
  const diff=Math.round((to-from)/86400000);
  return diff>0?diff:30;
}
function dispersionPeriodsPerYearForFrequency(terms){
  return terms?.paymentFrequency==='biweekly'?24:12;
}
function dispersionInterestForPeriod(terms,balanceStart,dueDate,previousDate){
  const interestCalculationBase=terms.interestCalculationBase||'global';
  const interestBase=interestCalculationBase==='outstanding_balance'?balanceStart:(terms.totalFinancedAmount||terms.approvedAmount||balanceStart||0);
  const periodDays=dispersionPeriodDays(previousDate,dueDate);
  const dailyOrdinaryRate=(terms.ordinaryAnnualRate||0)/360;
  if(interestCalculationBase==='global'){
    const periodsPerYear=dispersionPeriodsPerYearForFrequency(terms);
    const periodOrdinaryRate=(terms.ordinaryAnnualRate||0)/periodsPerYear;
    const interest=interestBase*periodOrdinaryRate;
    return {interestBase,periodDays,periodOrdinaryRate,dailyOrdinaryRate,interestCalculationBase,interest};
  }
  const interest=interestBase*dailyOrdinaryRate*periodDays;
  return {interestBase,periodDays,dailyOrdinaryRate,interestCalculationBase,interest};
}
function calculateFixedPeriodPayment(config){
  const principal=roundToCents(dispersionNumber(config?.principal,0));
  const terms=config?.terms||{};
  const totalPeriods=Math.max(1,Math.round(dispersionNumber(config?.totalPeriods,terms.numberOfPeriods||terms.termMonths||1)));
  const dueDates=Array.isArray(config?.dueDates)?config.dueDates:[];
  const startDate=config?.startDate||terms.dispersionDate||terms.signedAt||dueDates[0]||dispersionDateOnly(new Date());
  const interestCalculationBase=config?.interestCalculationBase||terms.interestCalculationBase||'global';
  if(!principal||!totalPeriods)return 0;
  if(interestCalculationBase==='outstanding_balance')return calculateFixedPaymentOutstandingBalance({principal,totalPeriods,dueDates,startDate,terms});
  let previousDate=startDate;
  let financialTotal=0;
  for(let i=0;i<totalPeriods;i++){
    const dueDate=dueDates[i]||dispersionNextPreferredDate(startDate,terms.preferredDay||15,i);
    const calc=dispersionInterestForPeriod({...terms,interestCalculationBase:'global',approvedAmount:principal,totalFinancedAmount:principal},principal,dueDate,previousDate);
    const interest=roundToCents(calc.interest);
    const interestIva=roundToCents(interest*0.16);
    financialTotal=roundToCents(financialTotal+interest+interestIva);
    previousDate=dueDate;
  }
  return roundToCents((principal+financialTotal)/totalPeriods);
}
function calculateFixedPaymentOutstandingBalance(config){
  const principal=roundToCents(dispersionNumber(config?.principal,0));
  const totalPeriods=Math.max(1,Math.round(dispersionNumber(config?.totalPeriods,1)));
  const dueDates=Array.isArray(config?.dueDates)?config.dueDates:[];
  const terms=config?.terms||{};
  const startDate=config?.startDate||terms.dispersionDate||terms.signedAt||dueDates[0]||dispersionDateOnly(new Date());
  const simulate=(payment)=>{
    let balance=principal;
    let previousDate=startDate;
    for(let i=0;i<totalPeriods;i++){
      const dueDate=dueDates[i]||dispersionNextPreferredDate(startDate,terms.preferredDay||15,i);
      const calc=dispersionInterestForPeriod({...terms,interestCalculationBase:'outstanding_balance'},balance,dueDate,previousDate);
      const interest=roundToCents(calc.interest);
      const interestIva=roundToCents(interest*0.16);
      let capital=roundToCents(payment-interest-interestIva);
      capital=Math.min(Math.max(capital,0),balance);
      balance=roundToCents(Math.max(balance-capital,0));
      previousDate=dueDate;
    }
    return balance;
  };
  let low=roundToCents(principal/totalPeriods);
  let high=Math.max(roundToCents(principal*2),roundToCents(low*2),1);
  let guard=0;
  while(simulate(high)>0.005&&guard<40){high=roundToCents(high*2); guard++;}
  for(let i=0;i<60;i++){
    const mid=(low+high)/2;
    if(simulate(mid)>0.005)low=mid; else high=mid;
  }
  return roundToCents(high);
}
function dispersionApplyFixedPeriodMath(row,terms,isLastPeriod){
  const updated={...row};
  const fixedPeriodPayment=roundToCents(dispersionNumber(updated.fixedPeriodPayment||updated.paymentAmountPerPeriod||terms.fixedPeriodPayment||terms.paymentAmountPerPeriod,0));
  const interest=roundToCents(dispersionNumber(updated.interest,0));
  const interestIva=roundToCents(dispersionNumber(updated.interestIva,0));
  const moratory=roundToCents(dispersionNumber(updated.moratory||updated.interesMora,0));
  const moratoryIva=roundToCents(dispersionNumber(updated.moratoryIva||updated.ivaMora,0));
  const commission=roundToCents(dispersionNumber(updated.commission,0));
  updated.moratory=moratory;
  updated.moratoryIva=moratoryIva;
  updated.interesMora=moratory;
  updated.ivaMora=moratoryIva;
  updated.commission=commission;
  if(isLastPeriod){
    updated.capital=roundToCents(Math.max(dispersionNumber(updated.balanceStart,0),0));
    updated.payment=roundToCents(updated.capital+interest+interestIva);
    updated.totalPayment=roundToCents(updated.payment+moratory+moratoryIva+commission);
  }else{
    updated.totalPayment=fixedPeriodPayment;
    updated.payment=roundToCents(Math.max(updated.totalPayment-moratory-moratoryIva-commission,0));
    updated.capital=roundToCents(updated.payment-interest-interestIva);
    updated.capital=roundToCents(Math.min(Math.max(updated.capital,0),dispersionNumber(updated.balanceStart,0)));
    updated.payment=roundToCents(updated.capital+interest+interestIva);
    updated.totalPayment=roundToCents(updated.payment+moratory+moratoryIva+commission);
  }
  updated.balanceEnd=roundToCents(Math.max(dispersionNumber(updated.balanceStart,0)-dispersionNumber(updated.capital,0),0));
  updated.fixedPeriodPayment=fixedPeriodPayment;
  updated.paymentAmountPerPeriod=fixedPeriodPayment;
  return updated;
}
function dispersionConceptDefs(){
  return [
    {key:'interes',total:'interest',paid:'interestPaid',pending:'interestPending',label:'Interés ordinario'},
    {key:'ivaInteres',total:'interestIva',paid:'ivaInteresPaid',pending:'ivaInteresPending',label:'IVA interés'},
    {key:'moratorio',total:'moratory',paid:'moratoryPaid',pending:'moratoryPending',label:'Interés Mora'},
    {key:'ivaMoratorio',total:'moratoryIva',paid:'ivaMoratorioPaid',pending:'ivaMoratorioPending',label:'IVA Mora'},
    {key:'commission',total:'commission',paid:'commissionPaid',pending:'commissionPending',label:'Comisiones'},
    {key:'moratorioSinInteres',total:'moratoryNonInterest',paid:'moratoryNonInterestPaid',pending:'moratoryNonInterestPending',label:'Moratorios sin intereses'},
    {key:'ordinarioSinInteres',total:'ordinaryNonInterest',paid:'ordinaryNonInterestPaid',pending:'ordinaryNonInterestPending',label:'Ordinarios sin intereses'},
    {key:'capital',total:'capital',paid:'capitalPaid',pending:'capitalPending',label:'Capital'}
  ];
}
function dispersionHydrateConcepts(row,old={}){
  const defs=dispersionConceptDefs();
  let legacyPaid=0;
  const hasConceptPaid=defs.some(d=>dispersionNumber(old[d.paid],0)>0);
  if(!hasConceptPaid)legacyPaid=dispersionNumber(old.paidAmount,0);
  defs.forEach(d=>{
    const total=dispersionNumber(row[d.total],0);
    let paid=dispersionNumber(old[d.paid],0);
    if(legacyPaid>0){const applied=Math.min(legacyPaid,total);paid+=applied;legacyPaid-=applied;}
    row[d.paid]=Math.min(paid,total);
    row[d.pending]=Math.max(total-row[d.paid],0);
  });
  row.paidAmount=defs.reduce((sum,d)=>sum+dispersionNumber(row[d.paid],0),0);
  row.pendingAmount=defs.reduce((sum,d)=>sum+dispersionNumber(row[d.pending],0),0);
  return row;
}
function dispersionApplyAmountToConcepts(row,amount,date,reference,method){
  let remaining=amount, appliedTotal=0;
  dispersionConceptDefs().forEach(d=>{
    if(remaining<=0)return;
    const total=dispersionNumber(row[d.total],0);
    const paid=dispersionNumber(row[d.paid],0);
    const pending=Math.max(total-paid,0);
    if(pending<=0)return;
    const applied=Math.min(remaining,pending);
    row[d.paid]=paid+applied;
    row[d.pending]=Math.max(total-row[d.paid],0);
    remaining-=applied;
    appliedTotal+=applied;
  });
  row.paidAmount=dispersionConceptDefs().reduce((sum,d)=>sum+dispersionNumber(row[d.paid],0),0);
  row.pendingAmount=dispersionConceptDefs().reduce((sum,d)=>sum+dispersionNumber(row[d.pending],0),0);
  if(appliedTotal>0){row.paymentDate=date;row.reference=reference;row.method=method;}
  row.status=row.pendingAmount<=0?'Pagado':(row.paidAmount>0?'Parcial':row.status);
  return {applied:appliedTotal,remaining};
}
function dispersionConceptDetailHtml(row){
  return dispersionConceptDefs().map(d=>`<div class="concept-row"><span>${d.label}</span><b>${fmtMoney(row[d.total]||0)}</b><b>${fmtMoney(row[d.paid]||0)}</b><b>${fmtMoney(row[d.pending]||0)}</b></div>`).join('');
}
function applyFinancialBreakdownToPatient(p){

function dispersionDateOnly(date){
  return toLocalISODate(date);
}
function dispersionAddMonths(date,months){
  const d=parseLocalDate(date);
  if(!d)return getTodayLocalMX();
  const day=d.getDate();
  d.setMonth(d.getMonth()+months);
  if(d.getDate()!==day)d.setDate(0);
  return d;
}
function dispersionNextPreferredDate(baseDate,preferredDay,offset=0){
  const base=parseLocalDate(baseDate)||getTodayLocalMX();
  const day=Math.min(Math.max(Number(preferredDay)||base.getDate()||15,1),28);
  let d=new Date(base.getFullYear(),base.getMonth(),day);
  if(d<=base)d=new Date(base.getFullYear(),base.getMonth()+1,day);
  if(offset)d=dispersionAddMonths(d,offset);
  return dispersionDateOnly(d);
}
function dispersionDaysPastDue(dateStr){
  const due=parseLocalDate(dateStr);
  if(!due)return 0;
  const today=getTodayLocalMX();
  const diff=Math.floor((today-due)/86400000);
  return diff>0?diff:0;
}

function dispersionNormalizeExtensionActiveRow(row,source={}){
  if(!dispersionIsExtensionActiveRow({...row,...source}))return row;
  const deferred=roundToCents(dispersionNumber(source.deferredCapital ?? row.deferredCapital ?? source.capitalPending ?? row.capital,0));
  const dueDate=source.currentDueDate||source.dueDate||row.currentDueDate||row.dueDate;

  const moratory=isPastNewDue?roundToCents(dispersionNumber(source.moratoryPending ?? source.moratory ?? row.moratory,0)):0;
  const moratoryIva=isPastNewDue?roundToCents(dispersionNumber(source.ivaMoratorioPending ?? source.moratoryIva ?? source.ivaMora ?? row.moratoryIva,0)):0;
  row.extensionStatus='active';
  row.status='Prórroga activa';
  row.deferredCapital=deferred;

  row.dueDate=row.currentDueDate;

  row.interest=0;

  row.interestPaid=0;
  row.ivaInteresPaid=0;
  row.commission=0;

  row.commissionPaid=0;
  row.moratory=moratory;
  row.moratoryIva=moratoryIva;

  row.moratoryPending=moratory;

  row.balanceEnd=roundToCents(Math.max(dispersionNumber(row.balanceStart,0)-deferred,0));

  row.paidAmount=0;
  row.pendingAmount=row.totalPayment;
  row.extensionCurrentPending=row.pendingAmount;
  return row;
}

function dispersionAddDaysToDateString(date,days){
  const d=parseLocalDate(date); if(!d)return '';

  return dispersionDateOnly(d);
}
function dispersionNextBiweeklyPatternDate(date,terms){
  const base=parseLocalDate(date); if(!base)return '';
  const option=normalizePaymentDayOption(terms.paymentDayOption||'15_last_day','biweekly');
  const days=paymentDaysFromOption(option,'biweekly');
  for(let monthOffset=0;monthOffset<18;monthOffset++){
    const monthAnchor=new Date(base.getFullYear(),base.getMonth()+monthOffset,1);
    const candidates=days.map(day=>dateForPaymentDay(monthAnchor.getFullYear(),monthAnchor.getMonth(),day)).sort((a,b)=>a-b);
    for(const candidate of candidates){
      if(candidate>base)return dispersionDateOnly(candidate);
    }
  }
  return dispersionAddDaysToDateString(date,15);
}
function dispersionNextMonthlyPatternDate(date,terms){
  const d=parseLocalDate(date); if(!d)return '';
  const option=normalizePaymentDayOption(terms.paymentDayOption||terms.preferredDay||'15','monthly');
  const nextMonth=new Date(d.getFullYear(),d.getMonth()+1,1);
  return dispersionDateOnly(dateForPaymentDay(nextMonth.getFullYear(),nextMonth.getMonth(),option));
}
function dispersionNextPeriodDateFrom(date,terms){
  return terms.paymentFrequency==='biweekly'?dispersionNextBiweeklyPatternDate(date,terms):dispersionNextMonthlyPatternDate(date,terms);
}
function dispersionExtensionNewDueDate(row,terms,days){
  const current=dispersionDateOnly(row.currentDueDate||row.dueDate);
  if(terms.paymentFrequency==='biweekly')return dispersionNextBiweeklyPatternDate(current,terms);
  return Number(days)===30?dispersionNextMonthlyPatternDate(current,terms):dispersionAddDaysToDateString(current,15);
}
function dispersionExtensionPending(row,totalKey,paidKey,pendingKey){
  if(Object.prototype.hasOwnProperty.call(row,pendingKey))return Math.max(dispersionNumber(row[pendingKey],0),0);
  return Math.max(dispersionNumber(row[totalKey],0)-dispersionNumber(row[paidKey],0),0);
}
function dispersionExtensionPreview(row,p,days){
  const terms=dispersionTerms(p);
  const selectedDays=Number(days)||dispersionExtensionAvailableDays(terms)[0];
  const capitalDeferred=roundToCents(dispersionExtensionPending(row,'capital','capitalPaid','capitalPending'));
  const interestPending=roundToCents(dispersionExtensionPending(row,'interest','interestPaid','interestPending'));
  const ivaInterestPending=roundToCents(dispersionExtensionPending(row,'interestIva','ivaInteresPaid','ivaInteresPending'));
  const moratoryPending=roundToCents(dispersionExtensionPending(row,'moratory','moratoryPaid','moratoryPending'));
  const ivaMoratoryPending=roundToCents(dispersionExtensionPending(row,'moratoryIva','ivaMoratorioPaid','ivaMoratorioPending'));
  const pct=selectedDays===30?0.05:0.03;
  const minFee=selectedDays===30?500:300;
  const extensionFee=roundToCents(Math.max(minFee,capitalDeferred*pct));
  const extensionFeeVat=roundToCents(extensionFee*0.16);
  const totalRequired=roundToCents(interestPending+ivaInterestPending+moratoryPending+ivaMoratoryPending+extensionFee+extensionFeeVat);
  const originalDueDate=dispersionDateOnly(row.currentDueDate||row.dueDate);
  const newDueDate=dispersionExtensionNewDueDate(row,terms,selectedDays);
  const rows=dispersionEnsureSchedule(p);
  const idx=rows.findIndex(r=>r.id===row.id);
  const shifted=[];
  if(idx>=0){
    const occupied=new Set(rows.slice(0,idx).filter(r=>!dispersionExtensionIsClosedRow(r)).map(r=>dispersionDateOnly(r.currentDueDate||r.dueDate)).filter(Boolean));
    let lastDate=newDueDate;
    occupied.add(lastDate);
    for(let i=idx+1;i<rows.length;i++){
      const r=rows[i];
      if(dispersionExtensionIsClosedRow(r))continue;
      const current=dispersionDateOnly(r.currentDueDate||r.dueDate);
      let next=current;
      if(!next||next<=lastDate||occupied.has(next))next=dispersionNextPeriodDateFrom(lastDate,terms);
      if(next!==current)shifted.push({id:r.id,number:r.number,from:current,to:next});
      occupied.add(next); lastDate=next;
    }
  }
  return {days:selectedDays,capitalDeferred,interestPending,ivaInterestPending,moratoryPending,ivaMoratoryPending,extensionFee,extensionFeeVat,totalRequired,originalDueDate,newDueDate,calendarShifted:shifted.length>0,shiftedRows:shifted,terms};
}

  const effectiveCapital=(r)=>Math.max(dispersionNumber(r.currentCapital,r.capital),0);
  const suffixActiveCapital=new Array(normalized.length).fill(0);
  let futureCapitalBalance=0;
  for(let i=normalized.length-1;i>=0;i--){
    const row=normalized[i];
    if(isOrdinaryActive(row))futureCapitalBalance+=effectiveCapital(row);
    suffixActiveCapital[i]=futureCapitalBalance;
  }
  let previousDate=terms.signedAt||terms.dispersionDate||'';
  normalized.forEach((row,idx)=>{
    if(row.status==='Reducida por prepago'){
      row.capital=0;
      row.currentCapital=0;
      row.capitalPending=0;
      row.pendingAmount=0;
      row.interest=0;
      row.interestIva=0;
      row.payment=0;
      row.totalPayment=0;
      row.balanceStart=0;
      row.balanceEnd=0;
      row.isClosed=true;
      row.paymentType=row.paymentType||'capital_prepay';
      row.prepaymentEffect='term_reduction';
      previousDate=row.dueDate||previousDate;
      return;
    }
    const isClosedByRealPayment=['Pagado','Pagado anticipado','Liquidado anticipadamente','Cancelada por liquidación','Cancelado','Condonado'].includes(row.status);
    if(isClosedByRealPayment){
      previousDate=row.dueDate||previousDate;
      return;
    }
    if(dispersionIsExtensionActiveRow(row)){
      dispersionNormalizeExtensionActiveRow(row,row);
      previousDate=row.dueDate||previousDate;
      return;
    }
    const cap=effectiveCapital(row);
    row.originalCapital=dispersionNumber(row.originalCapital,row.capital);
    row.currentCapital=cap;
    row.capital=cap;
    row.capitalPending=cap;
    row.balanceStart=Math.max(suffixActiveCapital[idx],0);
    row.balanceEnd=Math.max(row.balanceStart-cap,0);
    if(terms.interestCalculationBase==='outstanding_balance'){
      const calc=dispersionInterestForPeriod(terms,row.balanceStart,row.dueDate,previousDate||row.dueDate);
      row.interestBase=calc.interestBase;
      row.periodDays=calc.periodDays;
      row.dailyOrdinaryRate=calc.dailyOrdinaryRate;
      row.interestCalculationBase=calc.interestCalculationBase;
      row.interest=roundToCents(calc.interest);
      row.interestIva=roundToCents(row.interest*0.16);
    }
    row.payment=roundToCents(cap+dispersionNumber(row.interest,0)+dispersionNumber(row.interestIva,0));
    row.totalPayment=roundToCents(row.payment+dispersionNumber(row.moratory,0)+dispersionNumber(row.moratoryIva,0)+dispersionNumber(row.commission,0));
    row.paidAmount=dispersionNumber(row.paidAmount,0);
    row.pendingAmount=Math.max(row.totalPayment-row.paidAmount,0);
    if(row.status==='Ajustada por prepago'){
      row.isClosed=false;
      row.paymentType=row.paymentType||'capital_prepay';
      row.prepaymentEffect='term_reduction';
    }
    dispersionHydrateConcepts(row,row);
    previousDate=row.dueDate||previousDate;
  });
  return normalized;
}

function dispersionPendingConceptValue(row,totalKeys=[],paidKeys=[],pendingKeys=[]){
  for(const k of pendingKeys){
    if(Object.prototype.hasOwnProperty.call(row,k))return Math.max(dispersionNumber(row[k],0),0);
  }
  let total=0, paid=0;
  for(const k of totalKeys){
    if(Object.prototype.hasOwnProperty.call(row,k)){total=dispersionNumber(row[k],0);break;}
  }
  for(const k of paidKeys){
    if(Object.prototype.hasOwnProperty.call(row,k)){paid=dispersionNumber(row[k],0);break;}
  }
  return Math.max(total-paid,0);
}

function dispersionSettlementIsAccrualBoundaryRow(row,calculationDate){

function dispersionCalculateEarlySettlement(p,calculationDate=dispersionDateOnly(new Date())){
  const terms=dispersionTerms(p);
  const calcDate=dispersionDateOnly(calculationDate)||dispersionDateOnly(new Date());
  const builtRows=dispersionBuildSchedule(p); // build only; never assign to p.paymentSchedule in a simulation
  const rows=dispersionDeepCloneSchedule(builtRows);
  const activeRows=dispersionActiveCapitalRowsForSettlement(rows);
  const capitalPending=activeRows.reduce((sum,row)=>sum+dispersionCapitalPendingForSettlement(row),0);

  const alreadyAccruedRows=dispersionSettlementDueRowsAlreadyAccrued(rows,calcDate);
  const interestPendingAlreadyAccrued=alreadyAccruedRows.reduce((sum,row)=>sum+dispersionInterestPendingForSettlement(row),0);
  const ivaInterestPendingAlreadyAccrued=alreadyAccruedRows.reduce((sum,row)=>sum+dispersionInterestIvaPendingForSettlement(row),0);
  const moratoryPending=activeRows.filter(r=>['Vencido','Parcial','Pendiente'].includes(String(r.status||''))||dispersionMoratoryPendingForSettlement(r)>0).reduce((sum,row)=>sum+dispersionMoratoryPendingForSettlement(row),0);
  const moratoryIvaPending=activeRows.filter(r=>['Vencido','Parcial','Pendiente'].includes(String(r.status||''))||dispersionMoratoryIvaPendingForSettlement(r)>0).reduce((sum,row)=>sum+dispersionMoratoryIvaPendingForSettlement(row),0);
  const commissionsPending=activeRows.reduce((sum,row)=>sum+dispersionCommissionPendingForSettlement(row),0);
  const dailyOrdinaryRate=(terms.ordinaryAnnualRate||0)/360;
  const accrualStartDate=dispersionSettlementAccrualStartDate(rows,terms,calcDate);
  const accruedDays=dispersionDateDiffDays(accrualStartDate,calcDate);
  const currentAccrualRow=dispersionSettlementCurrentAccrualRow(rows,calcDate,accrualStartDate)||dispersionSettlementCurrentFutureRow(rows,calcDate);
  const interestBase=terms.interestCalculationBase==='outstanding_balance'?capitalPending:(terms.totalFinancedAmount||terms.approvedAmount||capitalPending||0);
  const grossAccruedNew=interestBase*dailyOrdinaryRate*accruedDays;
  const currentPaid=dispersionSettlementAlreadyPaidForCurrentPeriod(currentAccrualRow);
  const accruedNewInterestPending=Math.max(grossAccruedNew-currentPaid.interestPaid,0);
  const ivaGrossAccruedNew=grossAccruedNew*0.16;
  const ivaNewPending=Math.max(ivaGrossAccruedNew-currentPaid.ivaPaid,0);
  const interestAccrued=interestPendingAlreadyAccrued+accruedNewInterestPending;
  const interestIvaAccrued=ivaInterestPendingAlreadyAccrued+ivaNewPending;
  const total=capitalPending+interestAccrued+interestIvaAccrued+moratoryPending+moratoryIvaPending+commissionsPending;
  return {
    calculationDate:calcDate,
    capitalPending,
    interestAccrued,
    accruedOrdinaryInterest:interestAccrued,
    accruedOrdinaryInterestPending:interestAccrued,
    accruedOrdinaryInterestPaid:currentPaid.interestPaid,
    interestPendingFromRows:interestPendingAlreadyAccrued,
    interestPendingAlreadyAccrued,
    accruedNewInterestPending,
    interestIvaAccrued,
    ivaInterestPending:interestIvaAccrued,
    ivaInterestPaid:currentPaid.ivaPaid,
    ivaInterestPendingFromRows:ivaInterestPendingAlreadyAccrued,
    ivaInterestPendingAlreadyAccrued,
    ivaNewPending,
    moratoryPending,
    moratoryIvaPending,
    commissionsPending,
    total,
    totalToSettle:total,
    interestBase,
    accruedDays,
    dailyOrdinaryRate,
    interestCalculationBase:terms.interestCalculationBase,
    interestCalculationBaseLabel:interestCalculationBaseLabel(terms.interestCalculationBase),
    accrualStartDate,
    rowsConsideredForAccruedInterest:alreadyAccruedRows.length,
    simulationIsNonMutating:true,
    createdAt:new Date().toISOString()
  };
}

function dispersionSimulateEarlySettlement(){
  const p=contractSelectedPatient(); if(!p)return;

function dispersionPaymentEligibleStatuses(type){
  if(type==='advance_installment')return ['Programado','Parcial anticipado','Ajustada por prepago futura'];
  if(type==='ordinary')return ['Pendiente','Parcial','Vencido','Ajustada por prepago exigible'];
  return [];
}
function dispersionCompactPaymentTargetType(type){
  const raw=String(type||'').trim();
  const normalized=raw.toLowerCase();
  if(normalized.includes('pago inicial'))return 'Inicial';
  if(normalized.includes('inicial'))return 'Inicial';
  if(normalized.includes('mensualidad'))return 'Mensualidad';
  return raw||'Periodo';
}
function dispersionPaymentTargetOptions(rows,type){
  if(type==='capital_prepay')return '<option value="auto">Automático: adeudos pendientes y excedente a capital</option>';
  if(type==='early_liquidation')return '<option value="auto">Liquidación anticipada: usa simulación vigente</option>';
  if(type==='commission_upfront')return '<option value="commission_upfront">Comisión por apertura upfront</option>';
  const autoLabel=type==='advance_installment'?'Automático: primera mensualidad futura':'Automático: pago pendiente más antiguo';
  const isEligible=type==='advance_installment'?dispersionIsAdvancePayableRow:dispersionIsOrdinaryPayableRow;
  const options=rows.filter(r=>isEligible(r)).map(r=>{
    const compactType=dispersionCompactPaymentTargetType(r.type);
    const amount=fmtMoney(r.pendingAmount||r.totalPayment||r.payment);
    const compactLabel=`#${r.number} · ${compactType} · ${formatMaybeDate(r.dueDate)} · ${amount} · ${r.status}`;
    const fullLabel=`#${r.number} · ${r.type} · ${formatMaybeDate(r.dueDate)} · ${amount} · ${r.status}`;
    return `<option value="${escapeAttr(r.id)}" title="${escapeAttr(fullLabel)}">${escapeHtml(compactLabel)}</option>`;
  }).join('');
  return `<option value="auto">${autoLabel}</option>${options}`;
}

function dispersionSetPaymentTargetOptions(type){
  const p=contractSelectedPatient();
  const target=document.getElementById('dispersionPaymentTarget');
  if(!target||!p)return;
  const rows=dispersionEnsureSchedule(p);
  target.innerHTML=dispersionPaymentTargetOptions(rows,type);
  target.disabled=target.disabled||type==='early_liquidation';
}
function dispersionSelectPaymentRow(rowId){
  const p=contractSelectedPatient(); if(!p)return;
  const rows=dispersionEnsureSchedule(p);
  const row=rows.find(r=>r.id===rowId);
  if(!row){toast('No se encontró la amortización.');return;}
  if(dispersionIsClosedPaymentStatus(row.status)){toast('Esta amortización ya está cerrada y no puede recibir pagos.');return;}
  const typeEl=document.getElementById('dispersionPaymentType');
  const target=document.getElementById('dispersionPaymentTarget');
  if(dispersionIsAdvancePayableRow(row)){
    if(typeEl)typeEl.value='advance_installment';
    dispersionUpdatePaymentTypeUI();
    if(target)target.value=rowId;
    const msg=row.status==='Ajustada por prepago'?'Esta mensualidad fue ajustada por prepago y aún no es exigible. Se seleccionó Pago anticipado de mensualidad.':'Se seleccionó Pago anticipado de mensualidad porque esta fila aún no vence o fue cubierta parcialmente de forma anticipada.';
    toast(msg);
  }else if(dispersionIsOrdinaryPayableRow(row)){
    if(typeEl)typeEl.value='ordinary';
    dispersionUpdatePaymentTypeUI();
    if(target)target.value=rowId;
    const msg=row.status==='Ajustada por prepago'?'Esta mensualidad fue ajustada por un prepago a capital. Ya es exigible y puede recibir pago ordinario.':'Fila seleccionada para pago ordinario.';
    toast(msg);
  }else{
    toast('Esta amortización no puede recibir pagos con el tipo de pago actual.');
    return;
  }
  document.getElementById('dispersionPaymentAmount')?.focus();
}
function dispersionUpdatePaymentTypeUI(){
  const p=contractSelectedPatient();
  const type=document.getElementById('dispersionPaymentType')?.value||'ordinary';
  const copy=document.getElementById('dispersionPaymentTypeCopy');
  const btn=document.querySelector('.payment-apply-submit');
  const applyLiquidationBtn=document.getElementById('earlySettlementApplyButton');
  const target=document.getElementById('dispersionPaymentTarget');
  const liquidated=dispersionIsCreditLiquidated(p);
  if(copy)copy.textContent=liquidated?'Este crédito ya fue liquidado anticipadamente. No se pueden aplicar nuevos pagos.':dispersionPaymentTypeCopy(type,p);
  const prepayBox=document.getElementById('dispersionPrepayEffectBox');
  if(prepayBox)prepayBox.style.display=type==='capital_prepay'?'block':'none';
  const earlyBox=document.getElementById('dispersionEarlySettlementBox');
  if(earlyBox)earlyBox.style.display=type==='early_liquidation'?'block':'none';
  if(target){
    const baseDisabled=target.dataset.baseDisabled==='1';
    target.innerHTML=dispersionPaymentTargetOptions(dispersionEnsureSchedule(p),type);
    target.disabled=baseDisabled||type==='early_liquidation'||liquidated;
  }
  const amount=dispersionNumber(document.getElementById('dispersionPaymentAmount')?.value,0);
  const earlyValidation=type==='early_liquidation'?dispersionCanApplyEarlySettlement(p,amount):{ok:false};
  if(btn){
    const blocked=liquidated||(type==='capital_prepay'&&!dispersionCanPrepayOrLiquidate(p))||(type==='early_liquidation'&&!earlyValidation.ok);
    btn.disabled=btn.dataset.baseDisabled==='1'||blocked;
    btn.textContent=type==='early_liquidation'?'Aplicar liquidación':'Aplicar pago';
  }
  if(applyLiquidationBtn){
    applyLiquidationBtn.disabled=liquidated||!dispersionCanApplyEarlySettlement(p,amount).ok;
  }
}


function dispersionIsCreditLiquidated(p){
  const a=p?.application||{};
  const status=String(a.financialStatus||a.creditStatus||a.loanStatus||'').toLowerCase();
  return !!(a.earlySettlementApplied||status==='liquidated_early'||status.includes('liquidado anticipadamente'));
}
function dispersionLatestEarlySettlementSimulation(p){
  return dispersionEarlySettlementSimulation(p);
}
function dispersionCanApplyEarlySettlement(p,amount){
  if(!p||dispersionIsCreditLiquidated(p))return {ok:false,message:'Este crédito ya fue liquidado anticipadamente. No se pueden aplicar nuevos pagos.'};
  if(!dispersionCanSimulateEarlySettlement(p))return {ok:false,message:'La liquidación anticipada solo está disponible después de 3 meses desde la fecha de dispersión.'};
  const sim=dispersionLatestEarlySettlementSimulation(p);
  if(!sim||!(dispersionNumber(sim.totalToSettle??sim.total,0)>0))return {ok:false,message:'Primero calcula la simulación de liquidación.'};
  const total=dispersionNumber(sim.totalToSettle??sim.total,0);
  if(dispersionNumber(amount,0)<total)return {ok:false,message:'El monto recibido es menor al total para liquidar. No es posible cerrar el crédito.'};
  return {ok:true,total,sim,excess:Math.max(dispersionNumber(amount,0)-total,0)};
}
function dispersionSetConceptsSettled(row,mode){
  if(mode==='cancelled'){
    row.interest=0; row.interestIva=0; row.capital=0; row.currentCapital=0; row.commission=0; row.moratory=0; row.moratoryIva=0; row.payment=0; row.totalPayment=0;
  }
  dispersionConceptDefs().forEach(d=>{
    const total=dispersionNumber(row[d.total],0);
    if(mode==='covered')row[d.paid]=total;
    else row[d.paid]=0;
    row[d.pending]=0;
  });
  row.paidAmount=mode==='covered'?dispersionConceptDefs().reduce((sum,d)=>sum+dispersionNumber(row[d.paid],0),0):0;
  row.pendingAmount=0;
  row.capitalPending=0;
  row.interestPending=0;
  row.ivaInteresPending=0;
  row.ivaInterestPending=0;
  row.moratoryPending=0;
  row.ivaMoratorioPending=0;
  row.moratoryIvaPending=0;
  row.commissionPending=0;
  return row;
}
function dispersionApplyEarlySettlement(p,amount,date,reference,method){
  const validation=dispersionCanApplyEarlySettlement(p,amount);
  if(!validation.ok){toast(validation.message);return false;}
  const sim=validation.sim;
  const total=validation.total;
  const excess=validation.excess;
  const msg='¿Confirmas aplicar la liquidación anticipada y cerrar el crédito?';
  if(typeof confirm==='function'&&!confirm(msg))return false;
  const rows=dispersionEnsureSchedule(p);
  rows.forEach(row=>{
    const status=String(row.status||'');
    if(['Pagado','Pagado anticipado','Reducida por prepago','Cancelado','Condonado'].includes(status))return;
    row.settlementApplied=true;
    row.settlementDate=date;
    row.reference=reference;
    row.method=method;
    const isFuture=['Programado','Parcial anticipado'].includes(status)||(status==='Ajustada por prepago'&&!dispersionIsAdjustedPrepayPayable(row,date));
    if(isFuture){
      row.status='Cancelada por liquidación';
      row.paymentType='early_settlement_cancellation';
      dispersionSetConceptsSettled(row,'cancelled');
    }else{
      row.status='Liquidado anticipadamente';
      row.paymentType='early_settlement';
      dispersionSetConceptsSettled(row,'covered');
      row.paymentDate=date;
    }
  });
  p.paymentSchedule=rows;
  p.application=p.application||{};
  p.application.financialStatus='liquidated_early';
  p.application.creditStatus='liquidated_early';
  p.application.earlySettlementApplied=true;
  p.application.earlySettlementAppliedAt=new Date().toISOString();
  p.application.earlySettlementSummary={
    date,
    amountReceived:amount,
    totalApplied:total,
    excessAmount:excess,
    capitalSettled:dispersionNumber(sim.capitalPending,0),
    interestSettled:dispersionNumber(sim.interestAccrued||sim.accruedOrdinaryInterest||0,0),
    ivaInterestSettled:dispersionNumber(sim.interestIvaAccrued||sim.ivaInterestPending||0,0),
    moratorySettled:dispersionNumber(sim.moratoryPending,0),
    ivaMoratorySettled:dispersionNumber(sim.moratoryIvaPending,0),
    commissionsSettled:dispersionNumber(sim.commissionsPending,0),
    reference,
    method,
    status:'Liquidado anticipadamente',
    simulation:sim
  };
  if(!Array.isArray(p.payments))p.payments=[];
  p.payments.push({paymentType:'early_settlement',movementLabel:'Liquidación anticipada aplicada',date,amountReceived:amount,totalApplied:total,excessAmount:excess,capitalSettled:p.application.earlySettlementSummary.capitalSettled,interestSettled:p.application.earlySettlementSummary.interestSettled,ivaInterestSettled:p.application.earlySettlementSummary.ivaInterestSettled,moratorySettled:p.application.earlySettlementSummary.moratorySettled,ivaMoratorySettled:p.application.earlySettlementSummary.ivaMoratorySettled,commissionsSettled:p.application.earlySettlementSummary.commissionsSettled,reference,method,createdAt:new Date().toISOString()});
  addEntityEvent(p,'Liquidación anticipada aplicada',`Total liquidado ${fmtMoney(total)} · Recibido ${fmtMoney(amount)}${excess>0?` · Excedente no aplicado ${fmtMoney(excess)}`:''}`);
  persist(); patientTab='dispersion'; renderPatientDetail(); toast('Liquidación anticipada aplicada. Crédito cerrado.');
  return true;
}

  const s=p?.application?.earlySettlementSummary;

function dispersionApplyCapitalPrepayment(p,amount,date,reference,method){
  if(!dispersionCanPrepayOrLiquidate(p)){
    toast('No es posible aplicar prepago a capital antes de cumplir 3 meses desde la fecha de dispersión.');
    return false;
  }
  const terms=dispersionTerms(p);
  const rows=dispersionEnsureSchedule(p);
  let remaining=amount;
  let appliedToDues=0;
  let appliedToCapital=0;
  const dueRows=rows.filter(r=>['Vencido','Pendiente','Parcial'].includes(r.status)||dispersionIsAdjustedPrepayPayable(r)).sort((a,b)=>String(a.dueDate||'').localeCompare(String(b.dueDate||'')));
  dueRows.forEach(row=>{
    if(remaining<=0)return;
    const before=remaining;
    const result=dispersionApplyAmountToConcepts(row,remaining,date,reference,method);
    const applied=before-result.remaining;
    if(applied>0){
      row.paymentType='capital_prepay';
      row.status=row.pendingAmount<=0?'Pagado':'Parcial';
      appliedToDues+=applied;
      remaining=result.remaining;
    }
  });

  const futureRowsForBalance=rows.filter(r=>r.type!=='Pago inicial requerido'&&!['Pagado','Pagado anticipado','Reducida por prepago','Liquidado anticipadamente','Cancelada por liquidación','Cancelado','Condonado'].includes(String(r.status||'')));
  const capitalBalanceBeforePrepayment=futureRowsForBalance.reduce((sum,row)=>sum+Math.max(dispersionNumber(row.currentCapital,row.capital),0),0);
  const capitalPrepaymentAmount=Math.max(remaining,0);
  let capitalBalanceAfterPrepayment=capitalBalanceBeforePrepayment;

  if(capitalPrepaymentAmount>0){
    const futureRows=rows.filter(r=>r.type!=='Pago inicial requerido'&&['Programado','Ajustada por prepago'].includes(r.status)).sort((a,b)=>String(b.dueDate||'').localeCompare(String(a.dueDate||'')));
    for(const row of futureRows){
      if(remaining<=0)break;
      if(row.status==='Reducida por prepago')continue;
      const currentCapital=Math.max(dispersionNumber(row.currentCapital,row.capital),0);
      if(currentCapital<=0)continue;
      const applied=Math.min(remaining,currentCapital);
      row.originalCapital=dispersionNumber(row.originalCapital,currentCapital);
      row.originalPayment=dispersionNumber(row.originalPayment,row.payment);
      row.capitalPrepayReduction=dispersionNumber(row.capitalPrepayReduction,0)+applied;
      row.totalCapitalReducedByPrepayment=row.capitalPrepayReduction;
      row.prepaymentDate=date;
      row.prepaymentReference=reference;
      row.prepaymentMethod=method;
      row.paymentType='capital_prepay';
      row.prepaymentEffect='term_reduction';
      row.currentCapital=Math.max(currentCapital-applied,0);
      row.capital=row.currentCapital;
      row.capitalPending=row.currentCapital;
      row.payment=row.capital+dispersionNumber(row.interest,0)+dispersionNumber(row.interestIva,0);
      row.totalPayment=row.payment+dispersionNumber(row.moratory,0)+dispersionNumber(row.moratoryIva,0)+dispersionNumber(row.commission,0);
      row.pendingAmount=Math.max(row.totalPayment-dispersionNumber(row.paidAmount,0),0);
      if(row.currentCapital<=0){
        row.prepaymentFullyReduced=true;
        row.isClosed=true;
        row.interest=0; row.interestIva=0; row.capital=0; row.currentCapital=0; row.capitalPending=0; row.payment=0; row.totalPayment=0; row.pendingAmount=0;
        row.status='Reducida por prepago';
      }else{
        row.prepaymentFullyReduced=false;
        row.isClosed=false;
        row.status='Ajustada por prepago';
      }
      remaining-=applied;
      appliedToCapital+=applied;
    }
    capitalBalanceAfterPrepayment=Math.max(capitalBalanceBeforePrepayment-appliedToCapital,0);
  }

  p.paymentSchedule=dispersionNormalizePrepayFutureBalances(rows,terms);
  if(!Array.isArray(p.payments))p.payments=[];
  const reducedRows=p.paymentSchedule.filter(r=>r.status==='Reducida por prepago').length;
  const adjustedRows=p.paymentSchedule.filter(r=>r.status==='Ajustada por prepago').length;
  const prepayMove={amount,date,reference,method,target:'auto',paymentType:'capital_prepay',createdAt:new Date().toISOString(),appliedToDues,appliedToCapital,effect:'reduce_term',reducedRows,adjustedRows,unappliedAmount:remaining,capitalBalanceBeforePrepayment,capitalAppliedToPrepayment:appliedToCapital,capitalBalanceAfterPrepayment};
  prepayMove.movementLabel=dispersionPrepayMovementLabel(prepayMove);
  prepayMove.movementCopy=dispersionPrepayMovementCopy(prepayMove);
  p.payments.push(prepayMove);
  addEntityEvent(p,prepayMove.movementLabel,`Recibido ${fmtMoney(amount)} · Adeudos ${fmtMoney(appliedToDues)} · Capital ${fmtMoney(appliedToCapital)} · Saldo capital después ${fmtMoney(capitalBalanceAfterPrepayment)} · Efecto: reducción de plazo${remaining>0?` · Sobrante no aplicado ${fmtMoney(remaining)}`:''}`);
  persist(); patientTab='dispersion'; renderPatientDetail();
  if(appliedToDues>0&&appliedToCapital>0)toast('Pago aplicado. Se cubrieron adeudos pendientes y el excedente se aplicó a capital para reducir plazo.');
  else if(appliedToDues>0&&appliedToCapital<=0)toast('Pago aplicado a adeudos pendientes. No hubo excedente para prepago a capital.');
  else if(appliedToDues<=0&&appliedToCapital>0)toast('Prepago a capital aplicado. El pago mensual se mantiene y el plazo se reduce.');
  else toast('No fue posible aplicar el pago.');
  return true;
}


function dispersionApplyUpfrontOpeningFeePayment(p,amount,date,reference,method){
  const terms=dispersionTerms(p);
  if((terms.openingFeeMode||'upfront')!=='upfront'){
    toast('La comisión de este crédito está financiada; no se cobra upfront.');
    return false;
  }
  const pending=dispersionUpfrontOpeningFeePending(p,terms);
  if(pending<=0){toast('La comisión por apertura upfront ya está pagada.');return false;}
  const applied=Math.min(roundToCents(amount),pending);
  const remaining=roundToCents(Math.max(amount-applied,0));
  p.application=p.application||{};
  p.offer=p.offer||{};
  p.application.openingFeeUpfrontPaid=applied>=pending;
  p.offer.openingFeeUpfrontPaid=p.application.openingFeeUpfrontPaid;
  p.application.openingFeeUpfrontPaidAmount=roundToCents(dispersionNumber(p.application.openingFeeUpfrontPaidAmount,0)+applied);
  p.offer.openingFeeUpfrontPaidAmount=p.application.openingFeeUpfrontPaidAmount;
  if(!Array.isArray(p.payments))p.payments=[];
  const movement={amount:applied,date,reference,method,target:'commission_upfront',paymentType:'commission_upfront',type:'commission_upfront',movementLabel:'Comisión por apertura upfront',movementCopy:`Comisión pagada ${fmtMoney(applied)}${remaining>0?` · Sobrante no aplicado ${fmtMoney(remaining)}`:''}`,createdAt:new Date().toISOString(),unappliedAmount:remaining};
  p.payments.push(movement);
  addEntityEvent(p,'Comisión por apertura upfront pagada',`${fmtMoney(applied)} · ${method} · ${reference}${remaining>0?` · Sobrante ${fmtMoney(remaining)}`:''}`);
  persist(); patientTab='dispersion'; renderPatientDetail(); toast('Comisión por apertura upfront registrada');
  return true;
}

function dispersionApplyPayment(){
  const p=contractSelectedPatient(); if(!p)return;
  if(dispersionIsCreditLiquidated(p)){toast('Este crédito ya fue liquidado anticipadamente. No se pueden aplicar nuevos pagos.');return;}
  const amount=dispersionNumber(document.getElementById('dispersionPaymentAmount')?.value,0);
  if(!amount||amount<=0){toast('Captura un monto válido para aplicar el pago.');return;}
  const paymentType=(document.getElementById('dispersionPaymentType')?.value||'ordinary').trim();
  if(paymentType==='commission_upfront'){const date=document.getElementById('dispersionPaymentDate')?.value||dispersionDateOnly(new Date()); const reference=((document.getElementById('dispersionPaymentReference')?.value||'').trim()||dispersionApplicationCode(p)); const method=(document.getElementById('dispersionPaymentMethod')?.value||'SPEI').trim(); dispersionApplyUpfrontOpeningFeePayment(p,amount,date,reference,method); return;}
  if(paymentType==='capital_prepay'){const date=document.getElementById('dispersionPaymentDate')?.value||dispersionDateOnly(new Date()); const reference=((document.getElementById('dispersionPaymentReference')?.value||'').trim()||dispersionApplicationCode(p)); const method=(document.getElementById('dispersionPaymentMethod')?.value||'SPEI').trim(); dispersionApplyCapitalPrepayment(p,amount,date,reference,method); return;}
  if(paymentType==='early_liquidation'){const date=document.getElementById('dispersionPaymentDate')?.value||dispersionDateOnly(new Date()); const reference=((document.getElementById('dispersionPaymentReference')?.value||'').trim()||dispersionApplicationCode(p)); const method=(document.getElementById('dispersionPaymentMethod')?.value||'SPEI').trim(); dispersionApplyEarlySettlement(p,amount,date,reference,method); return;}
  const date=document.getElementById('dispersionPaymentDate')?.value||dispersionDateOnly(new Date());
  const reference=((document.getElementById('dispersionPaymentReference')?.value||'').trim()||dispersionApplicationCode(p));
  const method=(document.getElementById('dispersionPaymentMethod')?.value||'SPEI').trim();
  const target=(document.getElementById('dispersionPaymentTarget')?.value||'auto').trim();
  const rows=dispersionEnsureSchedule(p);
  let remaining=amount;
  let candidates=[];
  if(paymentType==='advance_installment'){
    const a=p.application||{};
    if(!(a.dispersionDate||a.disbursedAt||a.dispersedAt||a.amortizationStatus==='active')){toast('El pago anticipado solo está disponible cuando la tabla esté activa.');return;}
    if(target==='auto')candidates=rows.filter(r=>dispersionIsAdvancePayableRow(r)&&r.type!=='Pago inicial requerido');
    else candidates=rows.filter(r=>r.id===target&&dispersionIsAdvancePayableRow(r)&&r.type!=='Pago inicial requerido');
    if(!candidates.length){toast('No hay mensualidades futuras programadas disponibles para pago anticipado.');return;}
  }else{
    if(target==='auto'){
      candidates=rows.filter(r=>dispersionIsOrdinaryPayableRow(r));
    }else{
      const selected=rows.find(r=>r.id===target);
      if(selected&&dispersionIsAdvancePayableRow(selected)){toast('Para cubrir mensualidades futuras selecciona Pago anticipado de mensualidad.');return;}
      if(selected&&selected.status==='Ajustada por prepago'&&!dispersionIsAdjustedPrepayPayable(selected)){toast('Esta mensualidad fue ajustada por prepago, pero aún no es exigible. Para cubrirla antes de su fecha, selecciona Pago anticipado de mensualidad.');return;}
      if(selected&&!dispersionIsOrdinaryPayableRow(selected)){toast('Esta amortización no puede recibir pago ordinario.');return;}
      candidates=selected?[selected]:[];
    }
    if(!candidates.length){toast('No hay amortizaciones pendientes, parciales, vencidas o ajustadas exigibles para aplicar pago ordinario.');return;}
  }
  for(const row of candidates){
    if(remaining<=0)break;
    if(dispersionIsClosedPaymentStatus(row.status))continue;
    if(paymentType==='ordinary'&&!dispersionIsOrdinaryPayableRow(row))continue;
    if(paymentType==='advance_installment'&&!dispersionIsAdvancePayableRow(row))continue;
    const pending=Math.max(dispersionNumber(row.pendingAmount,row.totalPayment),0);
    if(pending<=0)continue;
    const result=dispersionApplyAmountToConcepts(row,remaining,date,reference,method);
    row.paymentType=paymentType;
    if(paymentType==='advance_installment')row.status=row.pendingAmount<=0?'Pagado anticipado':'Parcial anticipado';
    remaining=result.remaining;
    if(target!=='auto')break;
  }
  if(!Array.isArray(p.payments))p.payments=[];
  p.payments.push({amount,date,reference,method,target,paymentType,createdAt:new Date().toISOString(),unappliedAmount:remaining});
  addEntityEvent(p,paymentType==='advance_installment'?'Pago anticipado aplicado':'Pago aplicado',`${dispersionPaymentTypeLabel(paymentType)} · ${fmtMoney(amount)}${remaining>0?` · Sobrante no aplicado ${fmtMoney(remaining)}`:''}`);
  persist(); patientTab='dispersion'; renderPatientDetail(); toast(paymentType==='advance_installment'?'Pago anticipado aplicado':'Pago aplicado');
}
function dispersionMarkDispersed(){
  const p=contractSelectedPatient(); if(!p)return;
  const a=p.application||(p.application={});

}
function renderPayloadTab(p){
  if(session?.role!=='admin')return `<div class="patient-procedure-ok">No tienes permiso para ver el payload operativo.</div>`;
  return `<pre class="payload-pre">${JSON.stringify(p,null,2)}</pre>`;
}
function renderHistoryTab(p){
  const events=p.events||p.timeline||p.history||[];
  if(!Array.isArray(events)||!events.length)return `<div class="patient-procedure-ok">Sin historial operativo.</div>`;
  return `<div class="activity-list">${events.map(e=>`<div class="activity-item"><b>${e.title||e.type||'Evento'}</b><span>${e.text||e.description||''}</span><small>${formatMaybeDate(e.at||e.createdAt||e.date)}</small></div>`).join('')}</div>`;
}

function patientProgressStatus(p,key){
  const a=p.application||{};
  const docs=Array.isArray(p.documents)?p.documents:[];
  if(key==='created')return 'approved';
  if(key==='procedure')return a.procedure||a.procedures||a.procedureCost?'approved':'pending';
  if(key==='identity')return a.identityDone?'approved':docs.some(d=>['rejected','correction_required'].includes(d.status))?'correction_required':'review';
  if(key==='income')return a.incomeDone?'approved':'review';
  if(key==='documents'){
    if(docs.some(d=>d.status==='rejected'||d.status==='correction_required'))return 'correction_required';
    return a.documentsDone?'approved':'review';
  }
  if(key==='offer')return a.offerReady||p.offer?'approved':'locked';
  return 'pending';
}
function patientProgressLabel(status){
  return ({approved:'Aprobado',review:'En revisión',correction_required:'Corrección requerida',locked:'Bloqueado',rejected:'Rechazado',pending:'Pendiente'})[status]||labelStatus(status);
}
function patientProgressClass(status){
  return status==='approved'?'done':status==='locked'?'locked':'';
}
function patientProgressPill(status){
  if(status==='approved')return 'pill-green';
  if(status==='review')return 'pill-aqua';
  if(status==='correction_required'||status==='rejected')return 'pill-red';
  if(status==='locked')return 'pill-gray';
  return 'pill-gray';
}
function renderPatientProgress(p){
  const steps=[
    ['created','Solicitud creada','Registro capturado'],
    ['procedure','Procedimiento médico','Estimación preliminar guardada'],
    ['identity','Identidad y domicilio','Datos y evidencia en validación'],
    ['income','Ingresos','Perfil de ingresos capturado'],
    ['documents','Documentos','Documentos enviados a revisión'],
    ['offer','Oferta final','Disponible después de validación']
  ];
  return `<div class="patient-profile-progress">${steps.map((step,i)=>{const st=patientProgressStatus(p,step[0]);return `<div class="patient-profile-step ${patientProgressClass(st)}"><div class="patient-profile-step-num">${st==='approved'?'✓':i+1}</div><div><b>${step[1]}</b><span>${step[2]}</span></div><span class="pill ${patientProgressPill(st)}">${patientProgressLabel(st)}</span></div>`;}).join('')}</div>`;
}
function renderPatientNotifications(p){
  const a=p.application||{};
  const notes=[];
  if(a.requiresBureauNip)notes.push(['Autorización de Buró pendiente','El cliente requiere NIP actualizado para continuar.']);
  if(Array.isArray(p.documents)&&p.documents.some(d=>d.status==='correction_required'))notes.push(['Corrección documental requerida','Hay documentos que deben corregirse antes de avanzar.']);
  if(a.reapplyBlocked)notes.push(['Nueva solicitud bloqueada','El cliente no puede reaplicar por política actual.']);
  if(!notes.length)notes.push(['Sin alertas críticas','No hay correcciones o bloqueos relevantes en este momento.']);
  return `<div class="document-op-list">${notes.map(n=>`<div class="alert"><div class="alert-dot"></div><div><strong>${n[0]}</strong><p>${n[1]}</p></div></div>`).join('')}</div>`;
}
function renderSummaryProfileTab(p){
  const a=p.application||{};
  const d=patientProcedureData(p);
  const status=a.applicationStatus||currentPatientStage(p)||'created';

function escapeHtml(s){return String(s||'').replace(/[&<>]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;'}[c]))}
function escapeAttr(s){return String(s||'').replace(/[&<>\"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','\"':'&quot;',"'":'&#39;'}[c]))}
function docHtml(kind,ownerId){return d=>`<div class="doc-card"><div><h4>${d.type} ${docStatusPill(d.status)}</h4><p>${d.fileName} · ${d.source} ${d.reviewedBy?`· Revisado por ${d.reviewedBy}`:''}</p>${d.rejectionReason?`<div class="preview">Motivo: ${d.rejectionReason}</div>`:`<div class="preview">${d.simulatedPreview}</div>`}</div><div class="doc-actions"><button class="btn btn-sm btn-secondary" onclick="viewDoc('${d.fileName}')">Ver</button><button class="btn btn-sm btn-primary" onclick="docAction('${kind}','${ownerId}','${d.id}','approved')" ${!can('docs')?'disabled':''}>Aprobar</button><button class="btn btn-sm btn-coral" onclick="openDocReject('${kind}','${ownerId}','${d.id}')" ${!can('docs')?'disabled':''}>Rechazar</button><button class="btn btn-sm btn-secondary" onclick="docAction('${kind}','${ownerId}','${d.id}','correction_required')" ${!can('docs')?'disabled':''}>Corrección</button></div></div>`}

function patientProfileKeyFromRequest(p){
  const pt=p.patient||{};
  return String(pt.curp||pt.rfc||pt.email||pt.phone||pt.fullName||p.id||'sin-id').toLowerCase().trim();
}
function patientProfileDateValue(p){
  const a=p.application||{};
  return a.applicationSubmittedAt||a.submittedAt||a.applicationCreatedAt||a.createdAt||p.applicationDate||'';
}
function buildPatientProfiles(){
  const grouped={};
  db.patients.forEach(req=>{
    const key=patientProfileKeyFromRequest(req);
    if(!grouped[key])grouped[key]={key,patient:req.patient||{},requests:[]};
    grouped[key].requests.push(req);
  });
  return Object.values(grouped).map(profile=>{
    const requests=profile.requests.slice().sort((a,b)=>String(patientProfileDateValue(b)).localeCompare(String(patientProfileDateValue(a))));
    const latest=requests[0]||{};
    const latestApp=latest.application||{};
    const totalRequested=requests.reduce((sum,r)=>sum+Number(r.application?.requestedAmount||r.application?.amount||0),0);
    const totalApproved=requests.reduce((sum,r)=>sum+Number(r.offer?.approvedAmount||0),0);
    const latestPatient=latest.patient||profile.patient||{};
    return {...profile,patient:latestPatient,requests,latest,totalRequested,totalApproved,status:latestApp.applicationStatus||latestApp.stage||'No especificado'};
  }).sort((a,b)=>String(patientProfileDateValue(b.latest)).localeCompare(String(patientProfileDateValue(a.latest))));
}
function patientProfileMatches(profile){
  const rawQuery=patientProfileFilters.query||'';
  const q=normalizeSearchText(rawQuery);
  const phoneQuery=normalizePhone(rawQuery);
  const st=normalizeSearchText(patientProfileFilters.status||'');
  const pt=profile.patient||{};
  const searchableText=normalizeSearchText([
    pt.fullName, pt.phone, pt.email, pt.curp, pt.rfc,
    profile.latest?.id, profile.latest?.application?.applicationId, profile.latest?.application?.procedure,
    ...profile.requests.flatMap(req=>[
      req.id, req.patient?.phone, req.patient?.email, req.patient?.curp, req.patient?.rfc,
      req.application?.procedure, req.application?.doctorName, req.application?.doctorWhatsApp,
      req.application?.providerPhone, req.application?.providerWhatsApp
    ])
  ].flat(Infinity).filter(Boolean).join(' '));
  const searchablePhones=[
    pt.phone, pt.mobile, pt.whatsapp,
    ...profile.requests.flatMap(req=>[
      req.patient?.phone, req.patient?.mobile, req.patient?.whatsapp,
      req.application?.phone, req.application?.mobile, req.application?.whatsapp,
      req.application?.doctorWhatsApp, req.application?.doctorPhone,
      req.application?.providerPhone, req.application?.providerWhatsApp,
      ...Object.values(req.application?.procedureProviderContacts||{})
    ])
  ].map(normalizePhone).filter(Boolean).join(' ');
  const statusText=normalizeSearchText(profile.status||'');
  const matchesSearch=!q||searchableText.includes(q)||(phoneQuery&&searchablePhones.includes(phoneQuery));
  return matchesSearch&&(!st||statusText.includes(st));
}

function confirmOffer(id){const p=db.patients.find(x=>x.id===id);const existing=p.offer||{};const patientAmount=+$('#approvedAmount').value||0;const providerBase=+$('#providerBaseAmount').value||0;const providerExtra=+$('#providerExtraAmount').value||0;const openingPercent=+$('#commission').value||5;const amountToDisperse=Math.min(patientAmount,providerBase+providerExtra);p.offer={...existing,status:'borrador',approvedAmount:patientAmount,patientProcedureAmount:patientAmount,procedureAmount:patientAmount,procedureCost:patientAmount,providerBaseAmount:providerBase,providerExtraAmount:Math.max(0,amountToDisperse-providerBase),pulzzoCommercialFee:Math.max(0,patientAmount-amountToDisperse),amountToDisperse,termMonths:+$('#termMonths').value,commission:openingPercent,openingFee:openingPercent,openingFeeRate:openingPercent/100,openingFeeMode:$('#openingFeeMode')?.value||'upfront',totalCost:+$('#totalCost').value,insurance:+$('#insurance').value};p.application.openingFeeMode=p.offer.openingFeeMode;p.application.offerReady=true;p.application.applicationStatus='oferta_borrador';p.application.stage='Oferta borrador';applyFinancialBreakdownToPatient(p);addEntityEvent(p,'Oferta creada / editada',`${fmtMoney(p.offer.procedureAmount)} paciente · Dispersión ${fmtMoney(p.offer.amountToDisperse)} · Comisión ${openingFeeModeLabel(p.offer.openingFeeMode)}`);persist();closeModal();render();toast('Oferta guardada')}

function markOffer(id,status){const p=db.patients.find(x=>x.id===id);if(!p.offer){toast('Primero crea una oferta');return}p.offer.status=status;p.application.offerAccepted=status==='aceptada';p.application.offerRejected=status==='rechazada';p.application.applicationStatus=status==='aceptada'?'oferta_aceptada':'offer_rejected_by_client';p.application.stage=status==='aceptada'?'Oferta aceptada':'Cliente rechazó oferta';if(status==='aceptada'){p.application.contractReady=true;p.application.amortizationReady=true}else{p.application.reapplyAllowed=true;p.application.reapplyBlocked=false}addEntityEvent(p,status==='aceptada'?'Oferta aceptada':'Oferta rechazada por cliente');persist();render();toast('Oferta actualizada')}
function approvePatient(id){const p=db.patients.find(x=>x.id===id);p.application.applicationStatus='aprobada_para_oferta';p.application.stage='Aprobada para oferta';addEntityEvent(p,'Solicitud aprobada para oferta');persist();render();toast('Solicitud aprobada')}
function simplePatient(id,action,type){const p=db.patients.find(x=>x.id===id);if(type==='geo'){p.application.geoDone=true;p.application.geolocation.status='validated_by_backoffice';}if(type==='identity')p.application.identityDone=true;if(type==='references')p.application.referencesSaved=true;addEntityEvent(p,action);persist();render();toast(action)}
function reuseBureau(id){const p=db.patients.find(x=>x.id===id);p.application.creditAuthReusable=true;p.application.requiresBureauNip=false;p.application.bureauAuthorizationStatus='authorized_reused';addEntityEvent(p,'Buró reutilizado','Autorización vigente: no pedir NIP');persist();render();toast('Buró marcado como reutilizado')}
function viewDoc(name){modal(`<div class="modal-head"><div><h3>Documento simulado</h3><p>${escapeHtml(String(name||'Documento'))}</p></div><button class="x" onclick="closeModal()">×</button></div><div class="modal-body"><div class="preview" style="min-height:220px;display:grid;place-items:center;text-align:center">Vista previa simulada<br>No contiene documentos reales.</div></div><div class="modal-actions"><button class="btn btn-secondary" onclick="downloadSimulatedDoc('${escapeProcedureValue(String(name||'documento_demo.txt'))}')">Descargar documento</button><button class="btn btn-primary" onclick="closeModal()">Cerrar</button></div>`)}
function downloadSimulatedDoc(name){
  const safeName=String(name||'documento_demo.txt').replace(/[\/:*?"<>|]+/g,'_');
  const blob=new Blob([`Documento simulado Pulzzo\n${safeName}\nNo contiene documentos reales.`],{type:'text/plain;charset=utf-8'});
  const url=URL.createObjectURL(blob);
  const a=document.createElement('a');
  a.href=url;
  a.download=safeName.replace(/\.pdf$/i,'.txt')||'documento_demo.txt';
  document.body.appendChild(a);
  a.click();
  a.remove();
  URL.revokeObjectURL(url);
}
function docAction(kind,ownerId,docId,status,reason=''){const ent=kind==='patient'?db.patients.find(x=>x.id===ownerId):db.providers.find(x=>x.id===ownerId);const arr=kind==='patient'?ent.documents:ent.files;const d=arr.find(x=>x.id===docId);d.status=status;d.rejectionReason=reason|| (status==='rejected'?'Documento rechazado por backoffice': status==='correction_required'?'Corrección solicitada':'');d.reviewedBy=session.email;d.reviewedAt=now();if(status==='correction_required')d.correctionRequestedAt=now();addEntityEvent(ent,`${d.type}: ${labelStatus(status)}`,d.rejectionReason);persist();render();toast(`${d.type}: ${labelStatus(status)}`)}
function openDocReject(kind,ownerId,docId){modal(`<div class="modal-head"><div><h3>Rechazar documento</h3><p>Selecciona motivo de rechazo.</p></div><button class="x" onclick="closeModal()">×</button></div><div class="modal-body"><div class="field"><label>Motivo</label><select id="modalReason"><option>Documento ilegible</option><option>Documento incompleto</option><option>Datos no coinciden</option><option>Documento vencido</option></select></div><div class="field"><label>Comentario</label><textarea id="modalText"></textarea></div></div><div class="modal-actions"><button class="btn btn-secondary" onclick="closeModal()">Cancelar</button><button class="btn btn-coral" onclick="docAction('${kind}','${ownerId}','${docId}','rejected',$('#modalReason').value+' '+$('#modalText').value);closeModal()">Rechazar</button></div>`)}
function providerApprove(id){const p=db.providers.find(x=>x.id===id);p.status='aprobado';addEntityEvent(p,'Perfil aprobado');persist();render();toast('Perfil aprobado')}
function providerReject(id){const p=db.providers.find(x=>x.id===id);p.status='rechazado';addEntityEvent(p,'Perfil rechazado');persist();render();toast('Perfil rechazado')}
function providerFiscal(id,ok){const p=db.providers.find(x=>x.id===id);p.files.filter(d=>d.type.includes('CSF')||d.type.includes('Carátula')).forEach(d=>{d.status=ok?'approved':'rejected';d.reviewedBy=session.email;d.reviewedAt=now();if(!ok)d.rejectionReason='Fiscal/banco requiere corrección'});p.status=ok?'perfil_en_revision':'correccion_requerida';addEntityEvent(p,ok?'Fiscal y banco aprobado':'CLABE / CSF rechazado');persist();render();toast(ok?'Fiscal aprobado':'Fiscal rechazado')}
function providerSimple(id,action){const p=db.providers.find(x=>x.id===id);addEntityEvent(p,action);persist();render();toast(action)}
function addProc(id){const p=db.providers.find(x=>x.id===id);const name='Procedimiento demo '+(p.procedures.length+1);p.procedures.push(name);addEntityEvent(p,'Procedimiento agregado',name);persist();render()}
function removeProc(id,name){const p=db.providers.find(x=>x.id===id);p.procedures=p.procedures.filter(x=>x!==name);addEntityEvent(p,'Procedimiento eliminado',name);persist();render()}

document.addEventListener('click',function(e){
  const btn=e.target.closest&&e.target.closest('button.patient-profile-view-btn[data-patient-key]');
  if(!btn)return;
  e.preventDefault();
  e.stopPropagation();
  openPatientProfileFromButton(btn);
});

bootLogin();
window.openPatientProfile=openPatientProfile;
window.backToPatientProfiles=backToPatientProfiles;
