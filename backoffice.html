<style>

.login-shell{
  min-height:100vh;

  justify-content:center;
  align-items:center;

}
.login-card-brand .brand-symbol{width:56px;height:56px;object-fit:contain;border-radius:0;background:transparent;display:block}


.login-card-brand .brand-word{

  font-size:28px;
  font-weight:800;
  letter-spacing:-.06em;
}
.brand picture,.side-brand picture{
  display:flex;
  align-items:center;
  flex:0 0 auto;
  line-height:0;
}
.brand-symbol{
  width:36px;
  height:36px;
  object-fit:contain;
  border-radius:0;
  background:transparent;
  display:block;
}
.brand-word{
  display:block;
  color:#FFFFFF;
  text-transform:lowercase;
  letter-spacing:-.055em;
  line-height:1;
  font-family:var(--font-display);
  font-size:25px;
  font-weight:700;
}

<body>

<div id="loginView" class="login-shell">
  <section class="login-card">
    <div class="login-card-brand" aria-label="Pulzzo">
      <picture>
        <source srcset="assets/images/logo-pulzzo.webp" type="image/webp">
        <img src="assets/images/logo-pulzzo.png" alt="Pulzzo" class="brand-symbol">
      </picture>
    </div>
    <span class="eyebrow">Backoffice</span>
    <h2>Iniciar sesión</h2>
    
    <div class="field"><label>Correo interno Pulzzo</label><input id="loginEmail" value="admin@pulzzo.mx" autocomplete="off"></div>
    <div class="field"><label>Contraseña demo</label><input id="loginPass" type="password" value="pulzzo-demo"></div>
    <button class="btn btn-primary btn-full" id="loginBtn">Iniciar sesión</button>
    <div class="demo-users" id="demoUsers"></div>
  </section>
</div>

<div id="appView" class="app hidden">
  <aside id="sidebar" class="sidebar">
    <div class="side-brand"><span class="brand-mark">P</span><span>pulzzo</span></div>
    <span class="internal-pill">Backoffice operativo</span>
    <nav class="nav" id="nav"></nav>
    <div class="side-footer">
      <div class="user-card"><strong id="sideUser">Admin</strong><span id="sideRole">Administrador</span><span id="sideEmail">admin@pulzzo.mx</span></div>
      <button class="btn btn-secondary btn-full" id="logoutBtn">Cerrar sesión</button>
    </div>
  </aside>
  <main class="main">
    <header class="topbar">
      <button class="btn btn-soft mobile-menu" id="mobileMenu">☰</button>
      <div><h1 id="pageTitle">Dashboard</h1><p id="pageSub">Resumen ejecutivo operativo de Pulzzo.</p></div>
      <div class="top-actions"><span class="role-badge" id="roleBadge">Admin</span><button class="btn btn-secondary btn-sm" id="resetBtn">Reset demo</button></div>
    </header>
    <div class="content">
      <section id="dashboard" class="view active"></section>
      <section id="patients" class="view"></section>
      <section id="providers" class="view"></section>
      <section id="documents" class="view"></section>
      <section id="corrections" class="view"></section>
      <section id="offers" class="view"></section>
      <section id="history" class="view"></section>
      <section id="settings" class="view"></section>

  </main>
</div>

function statusPill(s){const x=String(s||'').toLowerCase();let cls='pill-gray'; if(x.includes('aprob')||x.includes('acept')||x==='approved'||x==='aprobado')cls='pill-green'; else if(x.includes('rechaz')||x.includes('blocked')||x==='rejected')cls='pill-red'; else if(x.includes('corre')||x.includes('pend')||x==='pending'||x.includes('fiscal'))cls='pill-amber'; else if(x.includes('oferta')||x.includes('evaluacion')||x.includes('revision')||x.includes('authorized'))cls='pill-aqua'; return `<span class="pill ${cls}">${labelStatus(s)}</span>`}

function renderNav(){const nav=$('#nav');nav.innerHTML=navItems.filter(n=>n.roles.includes(session.role)).map(n=>`<button class="nav-btn ${n.id===currentView?'active':''}" data-id="${n.id}"><span class="nav-icon">${n.icon}</span>${n.label}</button>`).join('');nav.onclick=e=>{const b=e.target.closest('.nav-btn');if(b)setView(b.dataset.id)}}
function render(){if(!session)return; if(currentView==='dashboard')renderDashboard(); if(currentView==='patients')renderPatients(); if(currentView==='providers')renderProviders(); if(currentView==='documents')renderDocuments(); if(currentView==='corrections')renderCorrections(); if(currentView==='offers')renderOffers(); if(currentView==='history')renderHistory(); if(currentView==='settings')renderSettings();}
function kpis(){const p=db.patients, providers=db.providers, allDocs=[...p.flatMap(x=>x.documents),...providers.flatMap(x=>x.files)];return {new:p.filter(x=>['en_evaluacion','correccion_pendiente'].includes(x.application.applicationStatus)).length,evaluation:p.filter(x=>x.application.applicationStatus.includes('evaluacion')).length,corrections:allDocs.filter(d=>d.status==='correction_required').length,rejectedDocs:allDocs.filter(d=>d.status==='rejected').length,offersSent:p.filter(x=>x.application.offerReady&&!x.application.offerAccepted).length,offersAccepted:p.filter(x=>x.application.offerAccepted).length,providersPending:providers.filter(x=>x.status!=='aprobado').length,total:p.reduce((a,x)=>a+Number(x.application.requestedAmount||0),0)}}
function renderDashboard(){const k=kpis();$('#dashboard').innerHTML=`<div class="section-head"><div><h2>Dashboard ejecutivo</h2><p>KPIs simulados conectados a las bandejas. Cualquier acción dentro del demo actualiza estos indicadores.</p></div><span class="pill pill-coral">Ambiente interno demo</span></div><div class="kpi-grid">${[
['Solicitudes nuevas',k.new,'En operación'],['En evaluación',k.evaluation,''],['Correcciones pendientes',k.corrections,'Paciente + Provider'],['Documentos rechazados',k.rejectedDocs,'Requieren acción'],['Ofertas enviadas',k.offersSent,'Pendientes de cliente'],['Ofertas aceptadas',k.offersAccepted,'Contrato / pago'],['Doctores pendientes',k.providersPending,''],['Monto solicitado',fmtMoney(k.total),'Total mock'],['Tiempo prom. revisión','18h','Simulado'],['Alertas operativas',k.corrections+k.rejectedDocs,'Prioridad']].map(x=>`<div class="kpi"><small>${x[0]}</small><strong>${x[1]}</strong><span>${x[2]}</span></div>`).join('')}</div><div class="grid-2"><div class="card"><div class="card-head"><h3>Alertas operativas</h3><button class="btn btn-sm btn-secondary" onclick="setView('corrections')">Ver correcciones</button></div><div class="card-body"><div class="alert-list">${alerts().join('')}</div></div></div><div class="card"><div class="card-head"><h3>Actividad reciente</h3><button class="btn btn-sm btn-secondary" onclick="setView('history')">Ver historial</button></div><div class="card-body"><div class="timeline">${db.audit.slice(0,6).map(eventHtml).join('')}</div></div></div></div>`}
function alerts(){let arr=[];db.patients.forEach(p=>{p.documents.filter(d=>['rejected','correction_required'].includes(d.status)).forEach(d=>arr.push(`<div class="alert"><span class="alert-dot"></span><div><strong>${p.patient.fullName}: ${d.type}</strong><p>${labelStatus(d.status)} · ${d.rejectionReason||'Requiere revisión'}</p></div></div>`))});db.providers.forEach(p=>{p.files.filter(d=>['pending','correction_required'].includes(d.status)).slice(0,2).forEach(d=>arr.push(`<div class="alert"><span class="alert-dot"></span><div><strong>${p.profile.prefix} ${p.profile.name}: ${d.type}</strong><p>${labelStatus(d.status)} · </p></div></div>`))});return arr.slice(0,8)}
function renderPatients(){const el=$('#patients');el.innerHTML=`<div class="master-detail"><div class="tray"><div class="tray-head"><div><strong>Bandeja de solicitudes</strong><p class="muted">Filtro por nombre, estatus, etapa, oferta y nueva solicitud.</p></div><div class="filters"><input id="pfName" placeholder="Buscar paciente"><select id="pfStatus"><option value="">Todos los estatus</option><option value="oferta">Oferta</option><option value="rechaz">Rechazo</option><option value="correccion">Corrección</option><option value="evaluacion">Evaluación</option></select><select id="pfReapply"><option value="">Reaplicar</option><option value="allowed">Permitida</option><option value="blocked">Bloqueada</option></select></div></div><div class="list" id="patientList"></div></div><div class="detail" id="patientDetail"></div></div>`;['pfName','pfStatus','pfReapply'].forEach(id=>$('#'+id).oninput=renderPatientList);renderPatientList();renderPatientDetail()}
function renderPatientList(){const q=($('#pfName')?.value||'').toLowerCase(), st=$('#pfStatus')?.value||'', re=$('#pfReapply')?.value||'';const list=$('#patientList');if(!list)return;let rows=db.patients.filter(p=>(!q||p.patient.fullName.toLowerCase().includes(q)||p.id.toLowerCase().includes(q))&&(!st||p.application.applicationStatus.includes(st)||p.application.stage.toLowerCase().includes(st))&&(!re||(re==='allowed'?p.application.reapplyAllowed:p.application.reapplyBlocked)));list.innerHTML=rows.map(p=>`<div class="row-item ${p.id===selectedPatientId?'active':''}" data-id="${p.id}"><div class="row-top"><div><div class="row-title">${p.patient.fullName}</div><div class="row-sub mono">${p.id} · ${fmtMoney(p.application.requestedAmount)}</div></div>${statusPill(p.application.applicationStatus)}</div><div class="row-sub">${p.application.procedure} · ${p.application.doctorName}</div><div class="row-meta"><span class="pill pill-aqua">Buró: ${p.application.requiresBureauNip?'NIP requerido':'vigente'}</span><span class="pill pill-gray">Docs: ${p.documents.filter(d=>d.status==='approved').length}/${p.documents.length}</span><span class="pill ${p.application.reapplyBlocked?'pill-red':p.application.reapplyAllowed?'pill-green':'pill-gray'}">Nueva: ${p.application.reapplyBlocked?'bloqueada':p.application.reapplyAllowed?'permitida':'no aplica'}</span></div></div>`).join('')||`<div class="empty-detail">Sin resultados</div>`;list.onclick=e=>{const r=e.target.closest('.row-item');if(r){selectedPatientId=r.dataset.id;patientTab='resumen';renderPatientList();renderPatientDetail()}}}
const patientTabs=['resumen','datos','geo','procedimiento','identidad','buro','documentos','referencias','oferta','contrato','nueva','payload','historial'];
function renderPatientDetail(){const p=db.patients.find(x=>x.id===selectedPatientId);const d=$('#patientDetail');if(!d||!p){if(d)d.innerHTML='<div class="empty-detail">Selecciona una solicitud.</div>';return}d.innerHTML=`<div class="detail-hero"><div class="detail-hero-top"><div><span class="pill pill-aqua mono">${p.id}</span><h3>${p.patient.fullName}</h3><p class="muted">${p.application.procedure} · ${p.application.doctorName}</p></div><div>${statusPill(p.application.applicationStatus)}</div></div><div class="detail-grid"><div class="mini"><small>Monto solicitado</small><strong>${fmtMoney(p.application.requestedAmount)}</strong></div><div class="mini"><small>Buró</small><strong>${p.application.requiresBureauNip?'Vencido / NIP':'Vigente'}</strong></div><div class="mini"><small>Oferta</small><strong>${p.offer?labelStatus(p.offer.status):'Sin oferta'}</strong></div><div class="mini"><small>Docs</small><strong>${p.documents.filter(x=>x.status==='approved').length}/${p.documents.length} aprobados</strong></div></div><div class="action-bar">${patientActionButtons(p)}</div></div><div class="tabs">${patientTabs.filter(t=>t!=='payload'||can('payload')).map(t=>`<button class="tab ${patientTab===t?'active':''}" data-tab="${t}">${tabLabel(t)}</button>`).join('')}</div><div class="tab-body">${patientTabContent(p)}</div>`;d.querySelector('.tabs').onclick=e=>{const b=e.target.closest('.tab');if(b){patientTab=b.dataset.tab;renderPatientDetail()}}}
function tabLabel(t){return ({resumen:'Resumen',datos:'Datos personales',geo:'Geolocalización',procedimiento:'Procedimiento',identidad:'Identidad / OCR',buro:'Buró',documentos:'Documentos',referencias:'Referencias',oferta:'Oferta',contrato:'Contrato / firma',nueva:'Nueva solicitud',payload:'Payload operativo',historial:'Historial'})[t]||t}
function patientActionButtons(p){return `<button class="btn btn-sm btn-secondary" onclick="openNote('patient','${p.id}')" ${!can('notes')?'disabled':''}>Nota interna</button><button class="btn btn-sm btn-secondary" onclick="openCorrection('patient','${p.id}')" ${!can('patientActions')?'disabled':''}>Pedir corrección</button><button class="btn btn-sm btn-coral" onclick="openReject('patient','${p.id}')" ${!can('riskActions')?'disabled':''}>Rechazar</button><button class="btn btn-sm btn-primary" onclick="approvePatient('${p.id}')" ${!can('riskActions')?'disabled':''}>Aprobar</button>`}
function patientTabContent(p){const a=p.application;if(patientTab==='resumen')return `<div class="info-grid">${info('Paciente',p.patient.fullName)+info('Estatus general',labelStatus(a.applicationStatus))+info('Application ID',a.applicationId)+info('Monto solicitado',fmtMoney(a.requestedAmount))+info('Procedimiento',a.procedure)+info('Doctor / clínica / hospital',a.doctorName)+info('Fecha deseada',a.when)+info('Oferta',p.offer?labelStatus(p.offer.status):'Sin oferta')+info('Documentos',p.documents.filter(d=>d.status==='approved').length+'/'+p.documents.length)+info('Buró',a.requiresBureauNip?'Vencido: requiere NIP':'Vigente / reutilizable')+info('Nueva solicitud',a.reapplyBlocked?'Bloqueada':a.reapplyAllowed?'Permitida':'No aplica')}</div>`;
if(patientTab==='datos')return `<div class="info-grid">${Object.entries({Nombre:p.patient.fullName,Teléfono:p.patient.phone,Correo:p.patient.email,CURP:p.patient.curp,RFC:p.patient.rfc,Dirección:p.patient.address,'Situación vivienda':p.patient.housingStatus,'Ingreso mensual':fmtMoney(p.patient.incomeMonthly),'Tipo ingreso':p.patient.incomeType,'Perfil financiero':'Capturado en solicitud'}).map(([k,v])=>info(k,v)).join('')}</div>`;
if(patientTab==='geo')return `<div class="info-grid">${info('geoDone',a.geoDone)+info('Permiso',a.geolocation.status)+info('Lat/Lng',a.geolocation.lat?`${a.geolocation.lat}, ${a.geolocation.lng}`:'No capturada')+info('Captura',a.geolocation.capturedAt||'Pendiente')}</div><div class="action-bar"><button class="btn btn-primary" onclick="simplePatient('${p.id}','Geolocalización validada','geo')" ${!can('patientActions')?'disabled':''}>Marcar ubicación validada</button><button class="btn btn-secondary" onclick="openCorrection('patient','${p.id}','ubicación')" ${!can('patientActions')?'disabled':''}>Solicitar revisión de ubicación</button></div>`;
if(patientTab==='procedimiento')return `<div class="info-grid">${info('Especialidades',a.specialties.join(', '))+info('Procedimientos',a.procedures.join(', '))+info('Costo procedimiento',fmtMoney(a.procedureCost))+info('Monto solicitado',fmtMoney(a.requestedAmount))+info('Cuándo',a.when)+info('Para quién',a.forWhom)+info('doctorSource',a.doctorSource)+info('doctorName',a.doctorName)+info('doctorWhatsApp',a.doctorWhatsApp||'No capturado')+info('doctorState',a.doctorState)+info('Asignaciones',JSON.stringify(a.procedureProviderAssignments),true)+info('Costos por procedimiento',JSON.stringify(a.procedureCosts),true)}</div>`;
if(patientTab==='identidad')return `<div class="doc-grid">${p.documents.filter(d=>['INE frente','INE reverso','Video-selfie','Comprobante domicilio'].includes(d.type)).map(docHtml('patient',p.id)).join('')}</div><div class="info-grid" style="margin-top:12px">${info('OCR nombre',p.patient.fullName)+info('OCR CURP',p.patient.curp)+info('OCR RFC',p.patient.rfc)+info('Validación manual',a.identityDone?'Validada':'Pendiente')}</div><div class="action-bar"><button class="btn btn-primary" onclick="simplePatient('${p.id}','Identidad validada','identity')" ${!can('patientActions')?'disabled':''}>Aprobar identidad</button><button class="btn btn-secondary" onclick="openCorrection('patient','${p.id}','identidad')" ${!can('patientActions')?'disabled':''}>Pedir corrección identidad</button></div>`;
if(patientTab==='buro')return `<div class="info-grid">${info('creditAuthConfirmed',a.creditAuthConfirmed)+info('creditAuthDate',a.creditAuthDate)+info('creditAuthValidUntil',a.creditAuthValidUntil)+info('creditAuthReusable',a.creditAuthReusable)+info('bureauAuthorizationStatus',a.bureauAuthorizationStatus)+info('requiresBureauNip',a.requiresBureauNip)+info('Canal usado','SMS + correo')+info('Regla operativa','3 años o relación jurídica activa',true)}</div><div class="action-bar"><button class="btn btn-primary" onclick="reuseBureau('${p.id}')" ${!can('riskActions')?'disabled':''}>Marcar Buró reutilizado</button></div>`;
if(patientTab==='documentos')return `<div class="doc-grid">${p.documents.map(docHtml('patient',p.id)).join('')}</div>`;
if(patientTab==='referencias')return `<div class="info-grid">${info('referencesSaved',a.referencesSaved)+info('Referencia 1','María López · Hermana · 55 1111 1111')+info('Referencia 2','Jorge Pérez · Amigo · 55 2222 2222')+info('Regla firma','La firma se bloquea si faltan referencias',true)}</div><div class="action-bar"><button class="btn btn-primary" onclick="simplePatient('${p.id}','Referencias completadas','references')" ${!can('patientActions')?'disabled':''}>Marcar referencias completas</button><button class="btn btn-secondary" onclick="openCorrection('patient','${p.id}','referencias')" ${!can('patientActions')?'disabled':''}>Pedir corrección referencias</button></div>`;
if(patientTab==='oferta')return `${p.offer?`<div class="info-grid">${Object.entries({Estado:p.offer.status,'Monto aprobado':fmtMoney(p.offer.approvedAmount),'Plazo':p.offer.termMonths+' meses','Pago mensual':fmtMoney(p.offer.monthlyPayment),Comisión:fmtMoney(p.offer.commission),'Costo total':fmtMoney(p.offer.totalCost),Seguro:fmtMoney(p.offer.insurance),'initialPaymentRequired':a.initialPaymentRequired,'initialInstallments':a.initialInstallments}).map(([k,v])=>info(k,v)).join('')}</div>`:'<div class="empty-detail">No hay oferta creada.</div>'}<div class="action-bar"><button class="btn btn-primary" onclick="openOffer('${p.id}')" ${!can('riskActions')?'disabled':''}>Crear / editar oferta</button><button class="btn btn-secondary" onclick="sendOffer('${p.id}')" ${!can('riskActions')?'disabled':''}>Enviar oferta</button><button class="btn btn-secondary" onclick="markOffer('${p.id}','aceptada')" ${!can('riskActions')?'disabled':''}>Marcar aceptada</button><button class="btn btn-secondary" onclick="markOffer('${p.id}','rechazada')" ${!can('riskActions')?'disabled':''}>Marcar rechazada</button><button class="btn btn-coral" onclick="openInitialPayments('${p.id}')" ${!can('riskActions')?'disabled':''}>Pagos iniciales</button></div>`;
if(patientTab==='contrato')return `<div class="info-grid">${info('contractReady',a.contractReady)+info('contractSigned',a.contractSigned)+info('preferredPaymentDay',a.preferredPaymentDay||'Pendiente')+info('paymentFrequency',a.paymentFrequency||'Pendiente')+info('referencesSaved',a.referencesSaved)+info('initialPaymentPaid',a.initialPaymentPaid)+info('doctorPaymentPaid',a.doctorPaymentPaid)+info('amortizationReady',a.amortizationReady)}</div>`;
if(patientTab==='nueva')return `<div class="info-grid">${info('previousApplications',a.previousApplications.length)+info('reapplyAllowed',a.reapplyAllowed)+info('reapplyBlocked',a.reapplyBlocked)+info('denied',a.denied)+info('deniedNoReapply',a.deniedNoReapply)+info('pulzzoRejected',a.pulzzoRejected)+info('offerRejected',a.offerRejected)+info('Regla','El botón Nueva solicitud solo se activa si backoffice lo permite.',true)}</div><div class="action-bar"><button class="btn btn-primary" onclick="setReapply('${p.id}',true)" ${!can('riskActions')?'disabled':''}>Permitir nueva solicitud</button><button class="btn btn-danger" onclick="openReapplyBlock('${p.id}')" ${!can('riskActions')?'disabled':''}>Bloquear nueva solicitud</button></div>`;
if(patientTab==='payload')return `<pre class="json-box">${escapeHtml(JSON.stringify({pulzzo_patient:p.patient,pulzzo_application:{state:p.application},pulzzo_backend_payload:{applicationId:p.id,patient:p.patient,application:p.application,documents:p.documents,offer:p.offer}},null,2))}</pre>`;
if(patientTab==='historial')return `<div class="timeline">${p.timeline.map(eventHtml).join('')}</div><div class="action-bar"><button class="btn btn-secondary" onclick="openNote('patient','${p.id}')" ${!can('notes')?'disabled':''}>Agregar nota interna</button></div>`;}
function info(k,v,full=false){return `<div class="info ${full?'info-full':''}"><small>${k}</small><span>${escapeHtml(String(v??'—'))}</span></div>`}
function escapeHtml(s){return s.replace(/[&<>]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;'}[c]))}
function docHtml(kind,ownerId){return d=>`<div class="doc-card"><div><h4>${d.type} ${statusPill(d.status)}</h4><p>${d.fileName} · ${d.source} ${d.reviewedBy?`· Revisado por ${d.reviewedBy}`:''}</p>${d.rejectionReason?`<div class="preview">Motivo: ${d.rejectionReason}</div>`:`<div class="preview">${d.simulatedPreview}</div>`}</div><div class="doc-actions"><button class="btn btn-sm btn-secondary" onclick="viewDoc('${d.fileName}')">Ver</button><button class="btn btn-sm btn-primary" onclick="docAction('${kind}','${ownerId}','${d.id}','approved')" ${!can('docs')?'disabled':''}>Aprobar</button><button class="btn btn-sm btn-coral" onclick="openDocReject('${kind}','${ownerId}','${d.id}')" ${!can('docs')?'disabled':''}>Rechazar</button><button class="btn btn-sm btn-secondary" onclick="docAction('${kind}','${ownerId}','${d.id}','correction_required')" ${!can('docs')?'disabled':''}>Corrección</button></div></div>`}
function eventHtml(e){return `<div class="event"><div></div><div class="event-card"><small>${e.at} · ${e.user} · ${e.role}</small><br><strong>${e.action}</strong><p>${e.entity||''}${e.comment?' · '+e.comment:''}</p></div></div>`}
function renderProviders(){const el=$('#providers');el.innerHTML=`<div class="master-detail"><div class="tray"><div class="tray-head"><div><strong>Bandeja doctores y clínicas</strong><p class="muted">: perfil, documentos, fiscal/banco y pacientes vinculados.</p></div><div class="filters"><input id="dfName" placeholder="Buscar doctor / clínica"><select id="dfType"><option value="">Todos</option><option>Doctor independiente</option><option>Clínica u hospital</option></select><select id="dfStatus"><option value="">Estatus</option><option value="aprobado">Aprobado</option><option value="pendiente">Pendiente</option><option value="revision">Revisión</option><option value="correccion">Corrección</option></select></div></div><div class="list" id="providerList"></div></div><div class="detail" id="providerDetail"></div></div>`;['dfName','dfType','dfStatus'].forEach(id=>$('#'+id).oninput=renderProviderList);renderProviderList();renderProviderDetail()}
function renderProviderList(){const q=($('#dfName')?.value||'').toLowerCase(), type=$('#dfType')?.value||'', st=$('#dfStatus')?.value||'';const rows=db.providers.filter(p=>(!q||(p.profile.name.toLowerCase().includes(q)||p.id.toLowerCase().includes(q)))&&(!type||p.profile.accountType===type)&&(!st||p.status.includes(st)));$('#providerList').innerHTML=rows.map(p=>`<div class="row-item ${p.id===selectedProviderId?'active':''}" data-id="${p.id}"><div class="row-top"><div><div class="row-title">${p.profile.prefix} ${p.profile.name}</div><div class="row-sub mono">${p.id} · ${p.profile.accountType}</div></div>${statusPill(p.status)}</div><div class="row-sub">${p.profile.city}, ${p.profile.state} · RFC ${p.fiscal.rfc}</div><div class="row-meta"><span class="pill pill-aqua">${p.procedures.length} procedimientos</span><span class="pill pill-gray">Docs: ${p.files.filter(d=>d.status==='approved').length}/${p.files.length}</span><span class="pill pill-coral">${p.profile.establishmentType}</span></div></div>`).join('');$('#providerList').onclick=e=>{const r=e.target.closest('.row-item');if(r){selectedProviderId=r.dataset.id;providerTab='resumen';renderProviderList();renderProviderDetail()}}}
const providerTabs=['resumen','documentos','fiscal','contacto','datos','procedimientos','interesados','operar','historial'];

torial'})[t]}</button>`).join('')}</div><div class="tab-body">${providerTabContent(p,linked)}</div>`;d.querySelector('.tabs').onclick=e=>{const b=e.target.closest('.tab');if(b){providerTab=b.dataset.tab;renderProviderDetail()}}}
function providerTabContent(p,linked){if(providerTab==='resumen')return `<div class="info-grid">${info('Tipo cuenta',p.profile.accountType)+info('Nombre visible',`${p.profile.prefix} ${p.profile.name}`)+info('Estatus',labelStatus(p.status))+info('Especialidades/procedimientos',p.procedures.join(', '))+info('Ciudad',p.profile.city)+info('Contacto visible',p.contact.visible)+info('Links',Object.values(p.links).filter(Boolean).join(' · ')||'Sin links')}</div>`;

if(providerTab==='contacto')return `<div class="info-grid">${Object.entries(p.contact).map(([k,v])=>info(k,v)).join('')+Object.entries(p.links).map(([k,v])=>info(k,v||'—')).join('')}</div><div class="action-bar"><button class="btn btn-primary" onclick="providerSimple('${p.id}','Contacto validado')" ${!can('providerActions')?'disabled':''}>Marcar contacto validado</button></div>`;
if(providerTab==='datos')return `<div class="info-grid">${Object.entries(p.profileData).map(([k,v])=>info(k,v||'—')).join('')}</div><div class="action-bar"><button class="btn btn-primary" onclick="providerSimple('${p.id}','Datos de atención completos')" ${!can('providerActions')?'disabled':''}>Marcar datos completos</button></div>`;
if(providerTab==='procedimientos')return `<div class="doc-grid">${p.procedures.map(x=>`<div class="doc-card"><div><h4>${x}</h4><p>Procedimiento activo demo</p></div><div class="doc-actions"><button class="btn btn-sm btn-secondary" onclick="removeProc('${p.id}','${x}')" ${!can('providerActions')?'disabled':''}>Quitar</button></div></div>`).join('')}</div><div class="action-bar"><button class="btn btn-primary" onclick="addProc('${p.id}')" ${!can('providerActions')?'disabled':''}>Agregar procedimiento simulado</button></div>`;
if(providerTab==='interesados')return tablePatients(linked.filter(x=>!x.application.offerAccepted));
if(providerTab==='operar')return tablePatients(linked.filter(x=>x.application.offerAccepted));
if(providerTab==='historial')return `<div class="timeline">${p.timeline.map(eventHtml).join('')}</div>`;}
function tablePatients(rows){return `<div class="table-wrap"><table class="table"><thead><tr><th>Paciente</th><th>Procedimiento</th><th>Monto</th><th>Estatus</th><th>Fecha tentativa</th></tr></thead><tbody>${rows.map(x=>`<tr><td>${x.patient.fullName}</td><td>${x.application.procedure}</td><td>${fmtMoney(x.application.requestedAmount)}</td><td>${statusPill(x.application.applicationStatus)}</td><td>${x.application.when}</td></tr>`).join('')||'<tr><td colspan="5">Sin pacientes en esta vista.</td></tr>'}</tbody></table></div>`}
function renderDocuments(){const rows=[...db.patients.flatMap(p=>p.documents.map(d=>({owner:p.patient.fullName,ref:p.id,kind:'Paciente',doc:d}))),...db.providers.flatMap(p=>p.files.map(d=>({owner:`${p.profile.prefix} ${p.profile.name}`,ref:p.id,kind:'Doctor/Clínica',doc:d})))];$('#documents').innerHTML=`<div class="section-head"><div><h2>Documentos</h2><p>Vista global para aprobar, rechazar o pedir corrección sin entrar al detalle.</p></div></div><div class="table-wrap"><table class="table"><thead><tr><th>Propietario</th><th>Tipo</th><th>Documento</th><th>Estado</th><th>Archivo</th><th>Acciones</th></tr></thead><tbody>${rows.map(r=>`<tr><td>${r.owner}<br><span class="muted mono">${r.ref}</span></td><td>${r.kind}</td><td>${r.doc.type}</td><td>${statusPill(r.doc.status)}</td><td>${r.doc.fileName}</td><td><button class="btn btn-sm btn-secondary" onclick="viewDoc('${r.doc.fileName}')">Ver</button></td></tr>`).join('')}</tbody></table></div>`}
function renderCorrections(){let rows=[];db.patients.forEach(p=>p.documents.filter(d=>['rejected','correction_required'].includes(d.status)).forEach(d=>rows.push({entity:p.patient.fullName,ref:p.id,field:d.type,motive:d.rejectionReason||'Corrección solicitada',status:d.status,responsible:''})));db.providers.forEach(p=>p.files.filter(d=>['rejected','correction_required'].includes(d.status)).forEach(d=>rows.push({entity:`${p.profile.prefix} ${p.profile.name}`,ref:p.id,field:d.type,motive:d.rejectionReason||'Corrección solicitada',status:d.status,responsible:''})));$('#corrections').innerHTML=`<div class="section-head"><div><h2>Correcciones</h2><p>Correcciones simuladas de pacientes y doctors/providers.</p></div></div><div class="table-wrap"><table class="table"><thead><tr><th>Entidad</th><th>Campo/documento</th><th>Motivo</th><th>Responsable</th><th>Estado</th><th>Fecha</th></tr></thead><tbody>${rows.map(r=>`<tr><td>${r.entity}<br><span class="muted mono">${r.ref}</span></td><td>${r.field}</td><td>${r.motive}</td><td>${r.responsible}</td><td>${statusPill(r.status)}</td><td>${today()}</td></tr>`).join('')||'<tr><td colspan="6">Sin correcciones pendientes.</td></tr>'}</tbody></table></div>`}
function renderOffers(){const rows=db.patients.map(p=>({p,offer:p.offer})).filter(x=>x.offer||x.p.application.offerReady||x.p.application.offerRejected);$('#offers').innerHTML=`<div class="section-head"><div><h2>Ofertas</h2><p>Monto solicitado, aprobado, plazo, pago mensual y pagos iniciales.</p></div></div><div class="table-wrap"><table class="table"><thead><tr><th>Solicitud</th><th>Paciente</th><th>Solicitado</th><th>Aprobado</th><th>Plazo</th><th>Pago mensual</th><th>Pagos iniciales</th><th>Estado</th><th>Acciones</th></tr></thead><tbody>${rows.map(x=>`<tr><td class="mono">${x.p.id}</td><td>${x.p.patient.fullName}</td><td>${fmtMoney(x.p.application.requestedAmount)}</td><td>${fmtMoney(x.offer?.approvedAmount||0)}</td><td>${x.offer?.termMonths||'—'}</td><td>${fmtMoney(x.offer?.monthlyPayment||0)}</td><td>${x.p.application.initialPaymentRequired?x.p.application.initialInstallments:'Ocultos'}</td><td>${statusPill(x.offer?.status||x.p.application.applicationStatus)}</td><td><button class="btn btn-sm btn-primary" onclick="selectedPatientId='${x.p.id}';openOffer('${x.p.id}')" ${!can('riskActions')?'disabled':''}>Editar</button></td></tr>`).join('')||'<tr><td colspan="9">Sin ofertas.</td></tr>'}</tbody></table></div>`}
function renderHistory(){$('#history').innerHTML=`<div class="section-head"><div><h2>Historial operativo</h2><p> simulada por usuario interno, rol, acción y entidad.</p></div></div><div class="card"><div class="card-body"><div class="timeline">${db.audit.map(eventHtml).join('')}</div></div></div>`}
function renderSettings(){$('#settings').innerHTML=`<div class="section-head"><div><h2>Configuración demo</h2><p>Preparado para usuarios internos, roles, motivos, reglas operativas y estados.</p></div></div><div class="grid-2"><div class="card"><div class="card-head"><h3>Usuarios internos demo</h3></div><div class="card-body"><div class="doc-grid">${users.map(u=>`<div class="doc-card"><div><h4>${u.email}</h4><p>${u.label} · contraseña demo: pulzzo-demo</p></div>${statusPill(u.role)}</div>`).join('')}</div></div></div><div class="card"><div class="card-head"><h3>Reglas y motivos</h3></div><div class="card-body"><div class="info-grid"><div class="info info-full"><small>Vigencia de Buró</small><span>3 años desde autorización original o relación jurídica activa cuando backend lo habilite.</span></div>${info('Motivos rechazo','Capacidad insuficiente · Documento inconsistente · Riesgo no aceptado',true)+info('Motivos corrección','Documento ilegible · Falta reverso · CSF desactualizada · CLABE no coincide',true)+info('Pagos iniciales','Si initialPaymentRequired=false, se ocultan del front paciente.',true)+info('Estados solicitud','en_evaluacion · oferta_enviada · oferta_aceptada · offer_rejected_by_client · rejected_can_reapply · rejected_blocked',true)+info('Estados doctor/clínica','perfil_incompleto · perfil_en_revision · aprobado · rechazado · correccion_requerida · fiscal_banco_pendiente',true)}</div></div></div></div>`}
function modal(html){$('#modal').innerHTML=html;$('#modalBackdrop').classList.add('show')} function closeModal(){$('#modalBackdrop').classList.remove('show')} $('#modalBackdrop').onclick=e=>{if(e.target.id==='modalBackdrop')closeModal()}
function openNote(kind,id){modal(`<div class="modal-head"><div><h3>Agregar nota interna</h3><p>La nota se agregará al timeline y auditoría.</p></div><button class="x" onclick="closeModal()">×</button></div><div class="modal-body"><div class="field"><label>Nota</label><textarea id="modalText" placeholder="Escribe una nota interna"></textarea></div></div><div class="modal-actions"><button class="btn btn-secondary" onclick="closeModal()">Cancelar</button><button class="btn btn-primary" onclick="confirmNote('${kind}','${id}')">Guardar nota</button></div>`)}
function confirmNote(kind,id){const txt=$('#modalText').value||'Nota interna agregada';const ent=kind==='patient'?db.patients.find(x=>x.id===id):db.providers.find(x=>x.id===id);ent.notes.unshift({at:now(),user:session.email,text:txt});addEntityEvent(ent,'Nota interna agregada',txt);persist();closeModal();render();toast('Nota agregada')}
function openCorrection(kind,id,field='documento/campo'){modal(`<div class="modal-head"><div><h3>Pedir corrección</h3><p>Se actualizará el estatus y se agregará un evento.</p></div><button class="x" onclick="closeModal()">×</button></div><div class="modal-body"><div class="field"><label>Motivo de corrección</label><select id="modalReason"><option>Documento ilegible</option><option>Falta información obligatoria</option><option>Datos no coinciden</option><option>Requiere versión actualizada</option></select></div><div class="field"><label>Comentario</label><textarea id="modalText">Corrección requerida en ${field}.</textarea></div></div><div class="modal-actions"><button class="btn btn-secondary" onclick="closeModal()">Cancelar</button><button class="btn btn-primary" onclick="confirmCorrection('${kind}','${id}')">Pedir corrección</button></div>`)}
function confirmCorrection(kind,id){const txt=$('#modalText').value, reason=$('#modalReason').value;const ent=kind==='patient'?db.patients.find(x=>x.id===id):db.providers.find(x=>x.id===id);if(kind==='patient')ent.application.applicationStatus='correccion_pendiente';else ent.status='correccion_requerida';addEntityEvent(ent,'Corrección solicitada',reason+' · '+txt);persist();closeModal();render();toast('Corrección solicitada')}
function openReject(kind,id){modal(`<div class="modal-head"><div><h3>Rechazar solicitud</h3><p>Define si puede volver a aplicar o queda bloqueada.</p></div><button class="x" onclick="closeModal()">×</button></div><div class="modal-body"><div class="field"><label>Tipo de rechazo</label><select id="rejectType"><option value="reapply">Rechazo Pulzzo con reaplicar</option><option value="blocked">Rechazo Pulzzo bloqueado</option></select></div><div class="field"><label>Motivo</label><textarea id="modalText">Capacidad de pago insuficiente para la oferta solicitada.</textarea></div></div><div class="modal-actions"><button class="btn btn-secondary" onclick="closeModal()">Cancelar</button><button class="btn btn-coral" onclick="confirmReject('${id}')">Rechazar</button></div>`)}
function confirmReject(id){const p=db.patients.find(x=>x.id===id), t=$('#rejectType').value;p.application.denied=true;p.application.pulzzoRejected=true;p.application.applicationStatus=t==='blocked'?'rejected_blocked':'rejected_can_reapply';p.application.stage=t==='blocked'?'Rechazo Pulzzo bloqueado':'Rechazo Pulzzo con reaplicar';p.application.deniedNoReapply=t==='blocked';p.application.reapplyBlocked=t==='blocked';p.application.reapplyAllowed=t!=='blocked';addEntityEvent(p,p.application.stage,$('#modalText').value);persist();closeModal();render();toast('Solicitud rechazada')}
function openReapplyBlock(id){modal(`<div class="modal-head"><div><h3>Bloquear nueva solicitud</h3><p>El historial del cliente mostrará nueva solicitud bloqueada.</p></div><button class="x" onclick="closeModal()">×</button></div><div class="modal-body"><div class="field"><label>Motivo</label><textarea id="modalText">Nueva solicitud bloqueada por política de riesgo.</textarea></div></div><div class="modal-actions"><button class="btn btn-secondary" onclick="closeModal()">Cancelar</button><button class="btn btn-danger" onclick="setReapply('${id}',false);closeModal()">Bloquear</button></div>`)}
function setReapply(id,allowed){const p=db.patients.find(x=>x.id===id);p.application.reapplyAllowed=allowed;p.application.reapplyBlocked=!allowed;p.application.deniedNoReapply=!allowed;if(!allowed)p.application.applicationStatus='rejected_blocked';addEntityEvent(p,allowed?'Nueva solicitud habilitada':'Nueva solicitud bloqueada');persist();render();toast(allowed?'Nueva solicitud permitida':'Nueva solicitud bloqueada')}
function openOffer(id){const p=db.patients.find(x=>x.id===id), o=p.offer||{};modal(`<div class="modal-head"><div><h3>Crear / editar oferta</h3><p>Oferta simulada. Actualiza bandeja, detalle, KPIs e historial.</p></div><button class="x" onclick="closeModal()">×</button></div><div class="modal-body"><div class="offer-grid"><div class="field"><label>Monto aprobado</label><input id="approvedAmount" type="number" value="${o.approvedAmount||p.application.requestedAmount}"></div><div class="field"><label>Plazo meses</label><input id="termMonths" type="number" value="${o.termMonths||18}"></div><div class="field"><label>Pago mensual</label><input id="monthlyPayment" type="number" value="${o.monthlyPayment||Math.round(p.application.requestedAmount/14)}"></div><div class="field"><label>Comisión</label><input id="commission" type="number" value="${o.commission||2500}"></div><div class="field"><label>Costo total</label><input id="totalCost" type="number" value="${o.totalCost||Math.round(p.application.requestedAmount*1.45)}"></div><div class="field"><label>Seguro</label><input id="insurance" type="number" value="${o.insurance||0}"></div></div></div><div class="modal-actions"><button class="btn btn-secondary" onclick="closeModal()">Cancelar</button><button class="btn btn-primary" onclick="confirmOffer('${id}')">Guardar oferta</button></div>`)}
function confirmOffer(id){const p=db.patients.find(x=>x.id===id);p.offer={status:'borrador',approvedAmount:+$('#approvedAmount').value,termMonths:+$('#termMonths').value,monthlyPayment:+$('#monthlyPayment').value,commission:+$('#commission').value,totalCost:+$('#totalCost').value,insurance:+$('#insurance').value};p.application.offerReady=true;p.application.applicationStatus='oferta_borrador';p.application.stage='Oferta borrador';addEntityEvent(p,'Oferta creada / editada',fmtMoney(p.offer.approvedAmount));persist();closeModal();render();toast('Oferta guardada')}
function openInitialPayments(id){const p=db.patients.find(x=>x.id===id);modal(`<div class="modal-head"><div><h3>Pagos iniciales</h3><p>Si se desactivan, no deben mostrarse al cliente.</p></div><button class="x" onclick="closeModal()">×</button></div><div class="modal-body"><div class="toggle-row"><div><strong>initialPaymentRequired</strong><p class="muted">Mostrar u ocultar pagos iniciales</p></div><span id="sw" class="switch ${p.application.initialPaymentRequired?'on':''}" onclick="this.classList.toggle('on')"></span></div><div class="field" style="margin-top:14px"><label>Número de pagos iniciales</label><input id="initInst" type="number" value="${p.application.initialInstallments||0}"></div></div><div class="modal-actions"><button class="btn btn-secondary" onclick="closeModal()">Cancelar</button><button class="btn btn-primary" onclick="confirmInitial('${id}')">Guardar</button></div>`)}
function confirmInitial(id){const p=db.patients.find(x=>x.id===id);const on=$('#sw').classList.contains('on');p.application.initialPaymentRequired=on;p.application.initialInstallments=on?Number($('#initInst').value||0):0;addEntityEvent(p,'Pagos iniciales actualizados',on?`${p.application.initialInstallments} pagos`:'Ocultos / 0');persist();closeModal();render();toast('Pagos iniciales actualizados')}
function sendOffer(id){const p=db.patients.find(x=>x.id===id);if(!p.offer){toast('Primero crea una oferta');return}p.offer.status='enviada';p.application.applicationStatus='oferta_enviada';p.application.stage='Oferta enviada';p.application.offerReady=true;addEntityEvent(p,'Oferta enviada');persist();render();toast('Oferta enviada')}
function markOffer(id,status){const p=db.patients.find(x=>x.id===id);if(!p.offer){toast('Primero crea una oferta');return}p.offer.status=status;p.application.offerAccepted=status==='aceptada';p.application.offerRejected=status==='rechazada';p.application.applicationStatus=status==='aceptada'?'oferta_aceptada':'offer_rejected_by_client';p.application.stage=status==='aceptada'?'Oferta aceptada':'Cliente rechazó oferta';if(status==='aceptada'){p.application.contractReady=true;p.application.amortizationReady=true}else{p.application.reapplyAllowed=true;p.application.reapplyBlocked=false}addEntityEvent(p,status==='aceptada'?'Oferta aceptada':'Oferta rechazada por cliente');persist();render();toast('Oferta actualizada')}
function approvePatient(id){const p=db.patients.find(x=>x.id===id);p.application.applicationStatus='aprobada_para_oferta';p.application.stage='Aprobada para oferta';addEntityEvent(p,'Solicitud aprobada para oferta');persist();render();toast('Solicitud aprobada')}
function simplePatient(id,action,type){const p=db.patients.find(x=>x.id===id);if(type==='geo'){p.application.geoDone=true;p.application.geolocation.status='validated_by_backoffice';}if(type==='identity')p.application.identityDone=true;if(type==='references')p.application.referencesSaved=true;addEntityEvent(p,action);persist();render();toast(action)}
function reuseBureau(id){const p=db.patients.find(x=>x.id===id);p.application.creditAuthReusable=true;p.application.requiresBureauNip=false;p.application.bureauAuthorizationStatus='authorized_reused';addEntityEvent(p,'Buró reutilizado','Autorización vigente: no pedir NIP');persist();render();toast('Buró marcado como reutilizado')}
function viewDoc(name){modal(`<div class="modal-head"><div><h3>Documento simulado</h3><p>${name}</p></div><button class="x" onclick="closeModal()">×</button></div><div class="modal-body"><div class="preview" style="min-height:220px;display:grid;place-items:center;text-align:center">Vista previa simulada<br>No contiene documentos reales.</div></div><div class="modal-actions"><button class="btn btn-primary" onclick="closeModal()">Cerrar</button></div>`)}
function docAction(kind,ownerId,docId,status,reason=''){const ent=kind==='patient'?db.patients.find(x=>x.id===ownerId):db.providers.find(x=>x.id===ownerId);const arr=kind==='patient'?ent.documents:ent.files;const d=arr.find(x=>x.id===docId);d.status=status;d.rejectionReason=reason|| (status==='rejected'?'Documento rechazado por backoffice': status==='correction_required'?'Corrección solicitada':'');d.reviewedBy=session.email;d.reviewedAt=now();if(status==='correction_required')d.correctionRequestedAt=now();addEntityEvent(ent,`${d.type}: ${labelStatus(status)}`,d.rejectionReason);persist();render();toast(`${d.type}: ${labelStatus(status)}`)}
function openDocReject(kind,ownerId,docId){modal(`<div class="modal-head"><div><h3>Rechazar documento</h3><p>Selecciona motivo de rechazo.</p></div><button class="x" onclick="closeModal()">×</button></div><div class="modal-body"><div class="field"><label>Motivo</label><select id="modalReason"><option>Documento ilegible</option><option>Documento incompleto</option><option>Datos no coinciden</option><option>Documento vencido</option></select></div><div class="field"><label>Comentario</label><textarea id="modalText"></textarea></div></div><div class="modal-actions"><button class="btn btn-secondary" onclick="closeModal()">Cancelar</button><button class="btn btn-coral" onclick="docAction('${kind}','${ownerId}','${docId}','rejected',$('#modalReason').value+' '+$('#modalText').value);closeModal()">Rechazar</button></div>`)}
function providerApprove(id){const p=db.providers.find(x=>x.id===id);p.status='aprobado';addEntityEvent(p,'Perfil aprobado');persist();render();toast('Perfil aprobado')}
function providerReject(id){const p=db.providers.find(x=>x.id===id);p.status='rechazado';addEntityEvent(p,'Perfil rechazado');persist();render();toast('Perfil rechazado')}
function providerFiscal(id,ok){const p=db.providers.find(x=>x.id===id);p.files.filter(d=>d.type.includes('CSF')||d.type.includes('Carátula')).forEach(d=>{d.status=ok?'approved':'rejected';d.reviewedBy=session.email;d.reviewedAt=now();if(!ok)d.rejectionReason='Fiscal/banco requiere corrección'});p.status=ok?'perfil_en_revision':'correccion_requerida';addEntityEvent(p,ok?'Fiscal y banco aprobado':'CLABE / CSF rechazado');persist();render();toast(ok?'Fiscal aprobado':'Fiscal rechazado')}
function providerSimple(id,action){const p=db.providers.find(x=>x.id===id);addEntityEvent(p,action);persist();render();toast(action)}
function addProc(id){const p=db.providers.find(x=>x.id===id);const name='Procedimiento demo '+(p.procedures.length+1);p.procedures.push(name);addEntityEvent(p,'Procedimiento agregado',name);persist();render()}
function removeProc(id,name){const p=db.providers.find(x=>x.id===id);p.procedures=p.procedures.filter(x=>x!==name);addEntityEvent(p,'Procedimiento eliminado',name);persist();render()}
bootLogin();
</script>
</body>
</html>
